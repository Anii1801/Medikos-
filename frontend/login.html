<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MediKiosk – Sign in</title><link rel="icon" href="favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"></head>
<body class="patient-app">
<main class="auth-page">
  <a class="brand auth-brand" href="index.html" aria-label="MediKiosk home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="currentColor"/><path d="M5 17h5.2l2.3-6.2 3.4 12.4L18.6 17H27" fill="none" stroke="#F4F7F5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span class="brand-copy"><span class="brand-name">MediKiosk</span><span class="brand-tagline">Your health, organized.</span></span></a>
  <section class="auth-panel card" aria-labelledby="auth-title">
    <p class="eyebrow">SECURE PATIENT ACCESS</p><h1 id="auth-title">Sign in or register</h1><p class="subtitle">Access your health timeline, reports, and summaries.</p>
    <div class="auth-tabs"><button class="btn btn-text active" id="login-tab" type="button">Sign in</button><button class="btn btn-text" id="register-tab" type="button">Register</button></div>
    <form id="auth-form"><label class="input-label" for="username">Username</label><input id="username" required autocomplete="username"><label class="input-label" for="password">Password</label><div class="password-field"><input id="password" type="password" required autocomplete="current-password"><button id="toggle-password" type="button" aria-label="Show password">Show</button></div><div id="name-field" hidden><label class="input-label" for="name">Your name</label><input id="name" autocomplete="name"></div><p class="field-error" id="auth-error" role="alert"></p><button class="btn btn-block" id="auth-submit" type="submit">Sign in</button></form>
    <p class="caption center"><a href="index.html">Return to homepage</a></p>
  </section>
</main>
<script src="common.js"></script><script>
let register = false;
const form = document.getElementById("auth-form"), error = document.getElementById("auth-error");
function setMode(value) { register = value; document.getElementById("name-field").hidden = !register; document.getElementById("password").autocomplete = register ? "new-password" : "current-password"; document.getElementById("auth-submit").textContent = register ? "Create account" : "Sign in"; document.getElementById("login-tab").classList.toggle("active", !register); document.getElementById("register-tab").classList.toggle("active", register); }
document.getElementById("login-tab").onclick = () => setMode(false); document.getElementById("register-tab").onclick = () => setMode(true);
document.getElementById("toggle-password").onclick = e => { const p=document.getElementById("password"); p.type=p.type==="password"?"text":"password"; e.currentTarget.textContent=p.type==="password"?"Show":"Hide"; };
form.onsubmit = async e => { e.preventDefault(); error.textContent=""; const submit=document.getElementById("auth-submit"); submit.disabled=true; submit.classList.add("is-loading"); try { const path=register?"/auth/register":"/auth/login"; const json=register?{username:username.value,password:password.value,name:name.value}:{username:username.value,password:password.value}; const result=await api(path,{json}); setToken(result.token); const next=new URLSearchParams(location.search).get("next"); location.href=next==="interview.html"?"dashboard.html":(next||"dashboard.html"); } catch(err) { error.textContent=err.message; } finally { submit.disabled=false; submit.classList.remove("is-loading"); } };
</script></body></html>
