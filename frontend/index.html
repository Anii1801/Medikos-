let lang = "en", voice = true, ans = {}, stack = [], ayush = false, me = null, _rec = null, cur = null, voiceTranscriptId = null, voiceTranscriptPromise = Promise.resolve(), interviewSessionId = null, speechVoices = [], spokenQuestionKey = null;
const t = k => T[lang][k] || k;

function showToast(msg, ms = 3500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}

function persistInterview() {
  try {
    sessionStorage.setItem("mk_iv", JSON.stringify({ interviewSessionId, ans, stack, ayush }));
  } catch (_) {}
}
function restoreInterview() {
  try {
    const saved = JSON.parse(sessionStorage.getItem("mk_iv") || "null");
    if (!saved) return false;
    interviewSessionId = saved.interviewSessionId || null;
    ans = saved.ans || {};
    stack = saved.stack || [];
    ayush = !!saved.ayush;
    return !!interviewSessionId;
  } catch (_) { return false; }
}
function clearInterview() {
  interviewSessionId = null; ans = {}; stack = [];
  sessionStorage.removeItem("mk_iv");
}
function hasInterviewProgress() {
  restoreInterview();
  return !!interviewSessionId && Object.keys(ans).some(k => k !== "_ay");
}

function refreshSpeechVoices() {
  if (window.speechSynthesis) speechVoices = speechSynthesis.getVoices();
}
function say(x, retrying = false) {
  if (!voice || !window.speechSynthesis) return;
  try {
    refreshSpeechVoices();
    if (!speechVoices.length && !retrying) {
      setTimeout(() => say(x, true), 150);
      return;
    }
    const requested = lang === "hi" ? "hi-IN" : "en-IN";
    const prefix = lang === "hi" ? "hi" : "en";
    const selected = speechVoices.find(v => v.lang.toLowerCase() === requested.toLowerCase())
      || speechVoices.find(v => v.lang.toLowerCase().startsWith(prefix));
    if (lang === "hi" && !selected) {
      showToast("Hindi audio is not installed in this browser. You can continue by reading or typing.");
      return;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(x);
    u.lang = selected ? selected.lang : requested;
    if (selected) u.voice = selected;
    speechSynthesis.speak(u);
  } catch (e) {
    showToast("Audio is unavailable. You can continue by reading or typing.");
  }
}
if (window.speechSynthesis) {
  refreshSpeechVoices();
  speechSynthesis.onvoiceschanged = refreshSpeechVoices;
}

const R = h => { document.getElementById("app").innerHTML = h; };

const textSizeButton = document.getElementById("text-size");
const textSizes = ["smallest", "medium", "large"];
let textSizeIndex = Number(localStorage.getItem("mk_text_size_index") || 0);
if (!Number.isInteger(textSizeIndex) || textSizeIndex < 0 || textSizeIndex >= textSizes.length) textSizeIndex = 0;
function applyTextSize() {
  const size = textSizes[textSizeIndex];
  document.documentElement.dataset.textSize = size;
  const labels = { smallest: "A−", medium: "A", large: "A+" };
  textSizeButton.textContent = labels[size];
  textSizeButton.setAttribute("aria-label", `Text size: ${size}`);
  textSizeButton.title = `Text size: ${size}`;
}
textSizeButton.onclick = () => {
  textSizeIndex = (textSizeIndex + 1) % textSizes.length;
  localStorage.setItem("mk_text_size_index", String(textSizeIndex));
  applyTextSize();
};
applyTextSize();

const themeButton = document.getElementById("theme");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const dark = theme === "dark";
  themeButton.textContent = dark ? "☼" : "◐";
  themeButton.setAttribute("aria-label", dark ? "Switch to light theme" : "Switch to dark theme");
  themeButton.title = dark ? "Light theme" : "Dark theme";
}
applyTheme(localStorage.getItem("mk_theme") || "light");
themeButton.onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("mk_theme", next);
  applyTheme(next);
};
document.getElementById("spk").onclick = () => {
  voice = !voice;
  document.getElementById("spk").textContent = voice ? "Audio" : "Muted";
  if (!voice) speechSynthesis?.cancel();
  showToast(voice ? "Audio on" : "Audio off");
};
document.getElementById("lang").onclick = () => {
  lang = lang === "en" ? "hi" : "en";
  document.getElementById("lang").textContent = lang === "en" ? "हि" : "EN";
  document.documentElement.lang = lang;
  route();
};

const siteNav = document.getElementById("site-nav");
const menuToggle = document.getElementById("menu-toggle");
menuToggle.onclick = () => {
  const open = !siteNav.classList.contains("open");
  siteNav.classList.toggle("open", open);
  menuToggle.setAttribute("aria-expanded", String(open));
  menuToggle.setAttribute("aria-label", open ? "Close menu" : "Open menu");
};

function setActive(id) {
  ["bn-home","bn-hist","bn-docs","bn-info"].forEach(i => {
    const el = document.getElementById(i);
    if (el) el.classList.toggle("active", i === id);
  });
}
function closeMenu() {
  siteNav.classList.remove("open");
  menuToggle.setAttribute("aria-expanded", "false");
}
function bnav(tab) {
  closeMenu();
  if (tab === "home") route();
  else if (tab === "hist") dashHistory();
  else if (tab === "docs") { if (TOKEN) docs(); else auth("Please sign in to upload reports."); }
  else if (tab === "info") aboutPage();
}

function updateHeaderAuth() {
  const btn = document.getElementById("hdr-auth");
  if (!btn) return;
  if (TOKEN && me && me.role !== "guest") {
    btn.setAttribute("aria-label", `Profile for ${me.name || me.username || "user"}`);
    btn.textContent = "Dashboard";
    btn.onclick = () => location.href = "dashboard.html";
  } else if (TOKEN) {
    btn.setAttribute("aria-label", "Guest profile");
    btn.textContent = "Continue";
    btn.onclick = () => location.href = "dashboard.html";
  } else {
    btn.setAttribute("aria-label", "Sign in");
    btn.textContent = "Sign in";
    btn.onclick = () => location.href = "login.html";
  }
}

async function route() {
  setActive("bn-home");
  restoreInterview();
  if (TOKEN) {
    try {
      me = await api("/me"); updateHeaderAuth();
      if (sessionStorage.getItem("mk_start_interview")) {
        sessionStorage.removeItem("mk_start_interview");
        return hasInterviewProgress() ? ask() : setup();
      }
      return me.role === "guest" && !hasInterviewProgress() ? setup() : homeDash();
    }
    catch (e) { setToken(""); }
  }
  updateHeaderAuth();
  landingPage();
}

function interviewCta() {
  return hasInterviewProgress() ? t("cont") : t("start");
}

  try { rs = await api("/records"); } catch (e) {}

  <div class="mt">
    <p class="eyebrow">Records</p>
    <h1>${t("dash")}</h1>
    <p class="subtitle">${esc(me.name || me.username)}</p>

    <div class="table-wrap"><table class="stack-table">
      <thead><tr><th>Token</th><th>Date</th><th>Priority</th><th>Status</th><th>ABDM</th></tr></thead>

let lastN = null;
async function startInterviewSession() {
  setActive("bn-home");
  try {
    const n = await api("/interview/sessions", { method: "POST", json: { budget: 30, ayush }});
    interviewSessionId = n.session_id; lastN = n; persistInterview();
    if (n.complete) return docs();
    draw(n);
  } catch (e) {
    showToast("Adaptive interview could not start: " + e.message);
    interviewSessionId = null;
    const n = await api("/interview/next", { json: { answers: ans, ayush }});
    lastN = n; if (n.complete) return docs(); draw(n);
  }
}
async function rebuildInterviewSession(drawIt = true) {
  const created = await api("/interview/sessions", { method: "POST", json: { budget: 30, ayush }});
  interviewSessionId = created.session_id;
  let response = created;
  for (const [field, value] of Object.entries(ans)) {
    if (field === "_ay") continue;
    response = await api("/interview/sessions/" + encodeURIComponent(interviewSessionId) + "/answers", { method: "POST", json: { field, value }});
  }
  lastN = response;
  persistInterview();
  if (response.complete) return docs();
  if (drawIt) draw(response);
}
async function ask() {
  setActive("bn-home");
  restoreInterview();
  if (!interviewSessionId) return startInterviewSession();
  try { const n = await api("/interview/sessions/" + encodeURIComponent(interviewSessionId)); lastN = n; if (n.complete) return docs(); draw(n); }
  catch (e) { showToast("Could not load interview: " + e.message); startInterviewSession(); }
}

function draw(n) {
  cur = n.question;
  const q = cur, l = lang === "en" ? "en" : "hi";
  const showProgress = Number(n.total) > 0;
  const pct = showProgress ? Math.round(n.answered / n.total * 100) : 0;
  const flagsBanner = n.red_flags.length ? `
    <div class="alert alert-emergency" role="alert">
      <span class="alert-icon">Urgent</span>
      <div><b>${t("flag")}</b><br>${n.red_flags.map(f => esc(f.msg)).join("<br>")}</div>
    </div>` : "";

  const body = q.type === "text"
    ? `<label class="input-label" for="tx">${t("type")}</label>
       <textarea id="tx">${esc(ans[q.id] || "")}</textarea>
       <div class="skip-row">
         <button type="button" class="btn btn-text" data-skip="Not sure">${t("notSure")}</button>
         <button type="button" class="btn btn-text" data-skip="Prefer not to answer">${t("preferNot")}</button>
       </div>
       <button class="mic-btn" id="mic" type="button">${t("speak")}</button>
       <span class="mut" id="heard" style="display:block;margin-top:8px"></span>`
    : `<div class="opts" role="group" aria-label="${esc(q[l])}">${q.options.map(o => {
        const sel = q.type === "multi" ? (ans[q.id] || []).includes(o.v) : ans[q.id] === o.v;
        return `<button class="opt${sel ? " sel" : ""}" data-v="${esc(o.v)}" aria-pressed="${sel}" type="button">${esc(o[l])}</button>`;
      }).join("")}</div>
      <button class="mic-btn" id="mic" type="button">${t("speak")}</button>
      <span class="mut" id="heard" style="display:block;margin-top:8px"></span>`;

  R(`
  ${flagsBanner}
  <div class="card mt">
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span class="caption">${esc(q.section)}</span>
      ${showProgress ? `<span class="caption">${n.answered}/${n.total}</span>` : ""}
    </div>
    ${showProgress ? `<div class="progress-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
    <h1 style="margin:14px 0 8px;font-size:1.35rem">${esc(q[l])}</h1>
    ${body}
    <div class="row sticky-actions mt" style="justify-content:space-between">
      <button class="btn btn-outline" id="bk" type="button">${t("back")}</button>
      <button class="btn" id="nx" type="button">${t("next")}</button>
    </div>
  </div>`);
  const questionKey = q.id + ":" + lang;
  if (spokenQuestionKey !== questionKey) {
    spokenQuestionKey = questionKey;
    say(q[l]);
  }

  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    const v = b.dataset.v;
    if (q.type === "multi") {
      let a = (ans[q.id] || []).filter(x => x !== "None");
      if (v === "None") a = ["None"];
      else a = a.includes(v) ? a.filter(x => x !== v) : [...a, v];
      ans[q.id] = a; persistInterview(); draw(lastN);
    } else { ans[q.id] = v; persistInterview(); adv(); }
  });
  document.querySelectorAll("[data-skip]").forEach(b => b.onclick = () => {
    const tx = document.getElementById("tx");
    if (tx) tx.value = b.dataset.skip;
  });
  document.getElementById("mic").onclick = () => listenVoice(q);
  document.getElementById("bk").onclick = async () => {
    const p = stack.pop();
    if (p) {
      persistInterview();
      const kept = ans[p];
      delete ans[p];
      try {
        await rebuildInterviewSession(false);
        if (kept !== undefined) ans[p] = kept;
        persistInterview();
        if (lastN) draw(lastN);
      } catch (e) {
        if (kept !== undefined) ans[p] = kept;
        showToast("Could not return to previous question: " + e.message);
      }
    } else { interviewSessionId = null; persistInterview(); setup(); }
  };
  document.getElementById("nx").onclick = () => {
    if (q.type === "text") ans[q.id] = document.getElementById("tx").value.trim();
    else if (q.type === "multi" && !(ans[q.id] || []).length) ans[q.id] = ["None"];
    else if (!ans[q.id]) { showToast("Please select or answer before continuing."); return; }
    persistInterview();
    const corrected = q.type === "text" ? ans[q.id] : null;
    const transcriptId = voiceTranscriptId;
    voiceTranscriptId = null;
    (async () => {
      if (transcriptId && corrected) {
        try { await api("/asr/transcripts/" + transcriptId, { method: "PUT", json: { corrected_transcript: corrected }}); }
        catch (e) { showToast("Transcript could not be saved; your answer remains on this screen."); }
      }
      adv();
    })();
  };
}

async function adv() {
  if (!cur) return;
  stack.push(cur.id);
  persistInterview();
  if (!interviewSessionId) return ask();
  const value = ans[cur.id];
  try {
    await voiceTranscriptPromise;
    const n = await api("/interview/sessions/" + encodeURIComponent(interviewSessionId) + "/answers", { method: "POST", json: { field: cur.id, value: value === undefined ? "" : value }});
    lastN = n;
    persistInterview();
    if (n.complete) return docs();
    draw(n);
  } catch (e) {
    stack.pop(); persistInterview(); showToast("Could not save this answer: " + e.message);
  }
}

function listenVoice(q, allowRetry = true) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) { showToast("Speech recognition is not available in this browser. Please type or tap an answer."); return; }
  if (_rec) { try { _rec.abort(); } catch (_) {} _rec = null; }
  const r = new SR(); _rec = r;
  r.lang = lang === "hi" ? "hi-IN" : "en-IN";
  r.continuous = false; r.interimResults = true; r.maxAlternatives = 3;
  const btn = document.getElementById("mic");
  const heard = document.getElementById("heard");
  if (btn) { btn.classList.add("listening"); btn.disabled = true; btn.textContent = "Listening…"; }
  if (heard) heard.textContent = "Listening… please speak clearly.";
  let finalTranscript = "";
  let recognitionError = false;
  const finish = () => {
    if (btn) { btn.classList.remove("listening"); btn.disabled = false; btn.textContent = t("speak"); }
    if (_rec === r) _rec = null;
  };
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = (e.results[i][0]?.transcript || "").trim();
      if (e.results[i].isFinal) finalTranscript += (finalTranscript ? " " : "") + text;
      else interim += (interim ? " " : "") + text;
    }
    const spoken = (finalTranscript || interim).trim();
    if (heard && spoken) heard.textContent = "Heard: “" + spoken + "” — check it before continuing.";
    if (q.type === "text" && spoken) { const tx = document.getElementById("tx"); if (tx) tx.value = spoken; }
  };
  r.onerror = e => {
    recognitionError = true;
    finish();
    if (e.error === "network" && allowRetry) {
      if (heard) heard.textContent = "Speech service temporarily unavailable. Retrying…";
      setTimeout(() => listenVoice(q, false), 350);
      return;
    }
    const messages = { "not-allowed": "Microphone permission was denied. Allow microphone access in browser settings.", "service-not-allowed": "The browser speech service is blocked. Try HTTPS/localhost or type your answer.", "no-speech": "No speech was detected. Try again closer to the microphone.", "audio-capture": "No microphone was found or it is busy.", "network": "The browser speech service is unavailable. Please type your answer or try again in Chrome/Edge on localhost or HTTPS." };
    if (heard) heard.textContent = messages[e.error] || ("Speech recognition failed: " + (e.error || "unknown error") + ". Please retry or type.");
  };
  r.onend = async () => {
    finish();
    const transcript = finalTranscript.trim();
    if (!transcript) { if (heard && !recognitionError) heard.textContent = "No transcript captured. Try again or type your answer."; return; }
    if (q.type === "text") {
      const tx = document.getElementById("tx"); if (tx) tx.value = transcript;
    } else {
      const norm = transcript.toLocaleLowerCase();
      const opts = q.options || [];
      const exact = opts.find(o => [o.en, o.hi, o.v].some(x => x && norm === String(x).toLocaleLowerCase()));
      const partial = exact || opts.find(o => [o.en, o.hi, o.v].some(x => x && norm.includes(String(x).toLocaleLowerCase())));
      if (partial) {
        if (q.type === "multi") ans[q.id] = [...new Set([...(ans[q.id] || []).filter(x => x !== "None"), partial.v])];
        else ans[q.id] = partial.v;
        persistInterview();
        draw(lastN);
        const h = document.getElementById("heard"); if (h) h.textContent = `Heard: “${transcript}”. Selected “${partial[lang === "hi" ? "hi" : "en"] || partial.v}”. Please verify, then press Continue.`;
      } else if (heard) heard.textContent = `Heard: “${transcript}”. I could not confidently match an option. Please tap the correct option or try again.`;
    }
    voiceTranscriptPromise = api("/asr/transcripts", { json: { transcript, language: lang === "hi" ? "hi" : "en", language_detected: lang === "hi" ? "hi" : "en" }})
      .then(saved => { voiceTranscriptId = saved.transcript_id; return saved; })
      .catch(() => { voiceTranscriptId = null; return null; });
    await voiceTranscriptPromise;
  };
  try { r.start(); } catch (e) { finish(); if (heard) heard.textContent = "Could not start microphone: " + e.message; }
}

function docStatus(d) {
  const ent = d.entities || {};
  if (d.processing_status === "failed") return { label: d.processing_error || "Processing failed", cls: "err" };
  if (d.processing_status === "needs_review") return { label: d.processing_error || "Needs review", cls: "warn" };
  if (!d.text) return { label: "Unreadable — type the contents", cls: "err" };
  if ((ent.review_flags || []).length) return { label: "Needs review", cls: "warn" };
  return { label: "Completed", cls: "ok" };
}

    await api("/documents/" + b.dataset.d, { method: "DELETE" }); docs();
  });
  document.querySelectorAll("[data-download-doc]").forEach(b => b.onclick = async () => {
    try { await downloadDocument("/documents/" + b.dataset.downloadDoc + "/file", b.dataset.filename); }
    catch (e) { showToast(e.message, 4000); }
  });
  document.getElementById("bk").onclick = () => { const p = stack.pop(); persistInterview(); ask(); };
  document.getElementById("nx").onclick = summaryPage;
}

let SEC = [];
async function summaryPage() {
  setActive("bn-home");
  const s = await api("/summary", { json: { answers: ans, ayush, lang }});
  SEC = s.sections;
  R(`
  <div class="step-hdr mt">
    <div class="step-number">3</div>
    <div><h1>${t("sumH")}</h1><p class="subtitle">${t("sumS")}</p></div>
  </div>
  ${renderClinicalReport(s.clinical_report, { mode: "patient" })}
  <p class="mut caption mt">${esc(s.patient_message)}</p>
  <div class="row sticky-actions" style="justify-content:space-between">
    <button class="btn btn-outline" id="bk" type="button">${t("back")}</button>
    <button class="btn btn-lg" id="ok" type="button">${t("send")}</button>
  </div>
  <p id="err" class="field-error"></p>
  `);
  say(s.patient_message);
  document.getElementById("bk").onclick = docs;
  document.getElementById("ok").onclick = async () => {
    const btn = document.getElementById("ok");
    btn.disabled = true;
    try { const r = await api("/submit", { json: { answers: ans, ayush, lang }}); clearInterview(); finish(r); }
    catch (e) { document.getElementById("err").textContent = e.message; btn.disabled = false; }
  };
}

function finish(r) {
  const PL = ["", "Emergency", "Urgent", "Routine"];
  R(`
  <div class="card token-card mt">
    <h1>${t("done")}</h1>
    <p class="subtitle">${t("tokenL")}</p>
    <span class="token-num">${r.token_no}</span>
    <p><span class="chip chip-${["","emergency","urgent","routine"][r.priority]}">${PL[r.priority]}</span></p>
    <p class="subtitle mt">${esc(r.patient_message)}</p>
    <p class="mut caption mt">ABDM: ${esc(r.abdm.ref)} (${r.abdm.mode})</p>
    <p class="mut caption">${t("wait")}</p>
    <button class="btn btn-lg btn-block mt" id="nw">Return home</button>
  </div>
  `);
  say(r.patient_message);
  document.getElementById("nw").onclick = async () => {
    if (me?.role === "guest") { setToken(""); me = null; updateHeaderAuth(); auth(); }
    else { me = await api("/me"); homeDash(); }
  };
}

restoreInterview();
route();
</script>
</body>
</html>
