<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <script>document.documentElement.lang=localStorage.getItem("mk_lang")==="hi"?"hi":"en";document.documentElement.dataset.languagePending="true";</script>
  <title>MediKiosk – Patient</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">

      </svg>
    </span>
    <span class="brand-copy">
      <span class="brand-name">MediKiosk</span>

<main class="page" id="app"></main>

<script src="common.js"></script>
<script>
const T = PATIENT_I18N;
let lang = getPatientLanguage(), voice = true, ans = {}, stack = [], ayush = false, me = null, _rec = null, cur = null, voiceTranscriptId = null, voiceTranscriptPromise = Promise.resolve(), interviewSessionId = null, speechVoices = [], spokenQuestionKey = null;
let inputMode = localStorage.getItem("mk_input_mode") === "voice" ? "voice" : "click";
let voiceState = "READY", voiceNeedsConfirmation = false, voiceRetryCount = 0, voiceRunId = 0, answerSaving = false;
let transcriptPersistenceFailed = false, pendingVoiceTranscript = "", voiceTranscriptOriginal = "", pendingAnswerTranscriptId = null;
const t = k => T[lang][k] || k;

function showToast(msg, ms = 3500) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove("show"), ms);
}

async function saveVoiceTranscript(transcript) {
  const language = lang === "hi" ? "hi" : "en";
  if (voiceTranscriptId && voiceTranscriptOriginal) {
    return api("/asr/transcripts/" + encodeURIComponent(voiceTranscriptId), {
      method: "PUT", json: { corrected_transcript: transcript }
    });
  }
  return api("/asr/transcripts", {
    json: { transcript, language, language_detected: null }
  });
}

function persistInterview() {
  try {
    sessionStorage.setItem("mk_iv", JSON.stringify({ interviewSessionId, ans, stack, ayush, inputMode }));
  } catch (_) {}
}
function restoreInterview() {
  try {
    const saved = JSON.parse(sessionStorage.getItem("mk_iv") || "null");
    if (!saved) return false;
    interviewSessionId = saved.interviewSessionId || null;
    ans = saved.ans || {};
    stack = saved.stack || [];
    ayush = !!saved.ayush;
    inputMode = saved.inputMode === "voice" || saved.inputMode === "click"
      ? saved.inputMode : (localStorage.getItem("mk_input_mode") === "voice" ? "voice" : "click");
    localStorage.setItem("mk_input_mode", inputMode);
    return !!interviewSessionId;
  } catch (_) { return false; }
}
function clearInterview() {
  interviewSessionId = null; ans = {}; stack = [];
  voiceState = "READY"; voiceNeedsConfirmation = false; voiceRetryCount = 0; answerSaving = false;
  transcriptPersistenceFailed = false; pendingVoiceTranscript = ""; voiceTranscriptOriginal = ""; pendingAnswerTranscriptId = null;
  sessionStorage.removeItem("mk_iv");
}
function hasInterviewProgress() {
  restoreInterview();
  return !!interviewSessionId && Object.keys(ans).some(k => k !== "_ay");
}

function refreshSpeechVoices() {
  if (window.speechSynthesis) speechVoices = speechSynthesis.getVoices();
}
function setVoiceState(state, detail = "") {
  voiceState = state;
  const indicator = document.getElementById("voice-state");
  if (indicator) {
    indicator.textContent = `${t(state === "READY" || state === "ASKING_QUESTION" ? "voiceStateReady" :
      state === "SPEAKING_QUESTION" ? "voiceStateSpeaking" :
      state === "LISTENING" || state === "WAITING_FOR_SPEECH" ? "voiceStateListening" :
      state === "VERIFYING_ANSWER" || state === "SAVING_ANSWER" || state === "TRANSCRIBING" ? "voiceStateProcessing" :
      state === "CLARIFICATION_REQUIRED" ? "voiceStateClarification" :
      state === "PAUSED" ? "voiceStatePaused" : state === "MICROPHONE_ERROR" || state === "TRANSCRIPTION_ERROR" ? "voiceStateError" :
      "voiceStateConfirm")}${detail ? ` — ${detail}` : ""}`;
    indicator.dataset.state = state;
  }
  const pauseButton = document.getElementById("voice-pause");
  if (pauseButton) pauseButton.textContent = t(state === "PAUSED" ? "resumeInterview" : "pauseInterview");
}
async function requestMicrophonePermission() {
  if (!navigator.mediaDevices?.getUserMedia) throw new Error(t("micUnavailable"));
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  stream.getTracks().forEach(track => track.stop());
}
function say(x, onEnd = null, retrying = false) {
  let finished = false;
  const finish = () => {
    if (finished) return;
    finished = true;
    if (typeof onEnd === "function") onEnd();
  };
  if (!voice || !window.speechSynthesis) {
    if (inputMode === "voice") showToast(lang === "hi"
      ? "इस ब्राउज़र में आवाज़ उपलब्ध नहीं है। प्रश्न पढ़ें; इसके बाद सुनना शुरू होगा।"
      : "Audio is unavailable in this browser. Read the question; listening will start afterward.");
    setTimeout(finish, 0);
    return false;
  }
  try {
    refreshSpeechVoices();
    if (!speechVoices.length && !retrying) {
      setTimeout(() => say(x, onEnd, true), 150);
      return true;
    }
    const requested = lang === "hi" ? "hi-IN" : "en-IN";
    const prefix = lang === "hi" ? "hi" : "en";
    const selected = speechVoices.find(v => v.lang.toLowerCase() === requested.toLowerCase())
      || speechVoices.find(v => v.lang.toLowerCase().startsWith(prefix));
    if (lang === "hi" && !selected) {
      showToast(t("ttsUnavailable"));
      setTimeout(finish, 0);
      return false;
    }
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(x);
    u.lang = selected ? selected.lang : requested;
    if (selected) u.voice = selected;
    u.onend = finish;
    u.onerror = finish;
    speechSynthesis.speak(u);
    return true;
  } catch (e) {
    showToast(lang === "hi" ? "आवाज़ उपलब्ध नहीं है। प्रश्न पढ़ें और लिखकर उत्तर दें।" : "Audio is unavailable. Read the question and type your answer.");
    setTimeout(finish, 0);
    return false;
  }
}
if (window.speechSynthesis) {
  refreshSpeechVoices();
  speechSynthesis.onvoiceschanged = refreshSpeechVoices;
}

const R = h => {
  document.getElementById("app").innerHTML = h;
  document.documentElement.removeAttribute("data-language-pending");
};
function applyStaticShellLanguage() {
  const langSelect = document.getElementById("lang");
  langSelect.value = lang;
  langSelect.setAttribute("aria-label", t("interfaceLanguage"));
  document.getElementById("brand-home").setAttribute("aria-label", `${t("home")} — MediKiosk`);
  document.querySelector(".brand-tagline").textContent = tr("Your health, organized.");
  [["bn-home", "Home"], ["bn-hist", "Medical History"], ["bn-info", "About"]]
    .forEach(([id, copy]) => { document.getElementById(id).textContent = tr(copy); });
  document.getElementById("site-nav").setAttribute("aria-label", t("patient"));
  document.getElementById("skip-link").textContent = tr("Skip to content");
  document.getElementById("text-size").setAttribute("aria-label", tr("Adjust text size"));
  document.getElementById("text-size").title = tr("Adjust text size");
  document.getElementById("theme").setAttribute("aria-label", tr("Switch theme"));
  document.getElementById("theme").title = tr("Switch theme");
  document.getElementById("spk").setAttribute("aria-label", tr("Audio prompts"));
  document.getElementById("spk").title = tr("Audio prompts");
  document.getElementById("menu-toggle").textContent = t("menu");
  document.getElementById("menu-toggle").setAttribute("aria-label", t("openMenu"));
  document.getElementById("spk").textContent = voice ? tr("Audio") : tr("Muted");
  document.getElementById("hdr-auth").textContent = tr("Sign in");
}
applyStaticShellLanguage();

const textSizeButton = document.getElementById("text-size");
const textSizes = ["smallest", "medium", "large"];
let textSizeIndex = Number(localStorage.getItem("mk_text_size_index") || 0);
if (!Number.isInteger(textSizeIndex) || textSizeIndex < 0 || textSizeIndex >= textSizes.length) textSizeIndex = 0;
function applyTextSize() {
  const size = textSizes[textSizeIndex];
  document.documentElement.dataset.textSize = size;
  const labels = { smallest: "A−", medium: "A", large: "A+" };
  textSizeButton.textContent = labels[size];
  textSizeButton.setAttribute("aria-label", lang === "hi" ? `अक्षर आकार: ${size}` : `Text size: ${size}`);
  textSizeButton.title = lang === "hi" ? `अक्षर आकार: ${size}` : `Text size: ${size}`;
}
textSizeButton.onclick = () => {
  textSizeIndex = (textSizeIndex + 1) % textSizes.length;
  localStorage.setItem("mk_text_size_index", String(textSizeIndex));
  applyTextSize();
};
applyTextSize();

const themeButton = document.getElementById("theme");
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const dark = theme === "dark";
  themeButton.textContent = dark ? "☼" : "◐";
  themeButton.setAttribute("aria-label", dark ? (lang === "hi" ? "हल्की थीम चुनें" : "Switch to light theme") : (lang === "hi" ? "गहरी थीम चुनें" : "Switch to dark theme"));
  themeButton.title = dark ? (lang === "hi" ? "हल्की थीम" : "Light theme") : (lang === "hi" ? "गहरी थीम" : "Dark theme");
}
applyTheme(localStorage.getItem("mk_theme") || "light");
themeButton.onclick = () => {
  const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
  localStorage.setItem("mk_theme", next);
  applyTheme(next);
};
document.getElementById("spk").onclick = () => {
  voice = !voice;
  document.getElementById("spk").textContent = voice ? tr("Audio") : tr("Muted");
  if (!voice) speechSynthesis?.cancel();
  showToast(voice ? (lang === "hi" ? "ऑडियो चालू" : "Audio on") : (lang === "hi" ? "ऑडियो बंद" : "Audio off"));
};
bindLanguageSelector("lang", () => {
  lang = getPatientLanguage();
  applyStaticShellLanguage();
  route();
});

const siteNav = document.getElementById("site-nav");
const menuToggle = document.getElementById("menu-toggle");
menuToggle.onclick = () => {
  const open = !siteNav.classList.contains("open");
  siteNav.classList.toggle("open", open);
  menuToggle.setAttribute("aria-expanded", String(open));
  menuToggle.textContent = t("menu");
  menuToggle.setAttribute("aria-label", open ? (lang === "hi" ? "मेनू बंद करें" : "Close menu") : t("openMenu"));
};

function setActive(id) {
  ["bn-home","bn-hist","bn-info"].forEach(i => {
    const el = document.getElementById(i);
    if (el) el.classList.toggle("active", i === id);
  });
}
function closeMenu() {
  siteNav.classList.remove("open");
  menuToggle.setAttribute("aria-expanded", "false");
}
function bnav(tab) {
  closeMenu();
  if (tab === "home") route();
  else if (tab === "hist") dashHistory();
  else if (tab === "info") aboutPage();
}

function updateHeaderAuth() {
  const btn = document.getElementById("hdr-auth");
  if (!btn) return;
  if (TOKEN && me && me.role !== "guest") {
    btn.setAttribute("aria-label", `${lang === "hi" ? "प्रोफ़ाइल" : "Profile"}: ${me.name || me.username || "user"}`);
    btn.textContent = t("dashboard");
    btn.onclick = () => location.href = "dashboard.html";
  } else if (TOKEN) {
    btn.setAttribute("aria-label", lang === "hi" ? "अतिथि प्रोफ़ाइल" : "Guest profile");
    btn.textContent = t("cont");
    btn.onclick = () => location.href = "dashboard.html";
  } else {
    btn.setAttribute("aria-label", t("signIn"));
    btn.textContent = t("signIn");
    btn.onclick = () => location.href = "login.html";
  }
}

async function route() {
  setActive("bn-home");
  restoreInterview();
  if (TOKEN) {
    try {
      me = await api("/me"); updateHeaderAuth();
      if (sessionStorage.getItem("mk_start_interview")) {
        sessionStorage.removeItem("mk_start_interview");
        return hasInterviewProgress() ? ask() : setup();
      }
      return me.role === "guest" && !hasInterviewProgress() ? setup() : homeDash();
    }
    catch (e) { setToken(""); }
  }
  updateHeaderAuth();
  landingPage();
}

function interviewCta() {
  return hasInterviewProgress() ? t("cont") : t("start");
}

function landingPage() {
  R(`
  <section class="mk-home" aria-labelledby="hero-title">
    <p class="eyebrow">${tr("YOUR HEALTH, ORGANIZED")}</p>
    <h1 id="hero-title">${t("welcome")}</h1>
    <p class="mk-intro">${t("sub")}</p>
    <div class="hero-actions mk-landing-actions">
      <button class="btn btn-lg" id="st">${t("start")}</button>
    </div>
    <article class="mk-feature-card">
      <div class="mk-feature-icon">${ICONS.history}</div>
      <div class="mk-feature-copy">
        <h2>${tr("Medical History")}</h2>
        <p>${tr("Answer a few questions about your symptoms, health history, and medications.")}</p>
      </div>
      <div class="mk-progress" aria-live="polite">
        <span class="mk-progress-label">${tr("Not started")}</span>
      </div>
      <button class="btn mk-feature-action" id="card-hist">${t("start")} <span aria-hidden="true">→</span></button>
    </article>
    <div class="mk-support-grid">
      <article class="mk-support-card" id="card-time" role="button" tabindex="0">
        <div class="mk-support-icon">${ICONS.timeline}</div>
        <h2>${tr("Health Timeline")}</h2>
        <p>${tr("Review your recorded history.")}</p>
      </article>
    </div>
    <section class="mk-summary-preview" aria-labelledby="summary-preview-title">
      <div>
        <p class="eyebrow">${tr("MY HEALTH SUMMARY")}</p>
        <h2 id="summary-preview-title">${tr("Your recorded history, organized.")}</h2>
        <p>${tr("Sign in or start an interview to create and review your health summary.")}</p>
      </div>
      <button class="btn btn-outline" id="card-sum">${tr("View Summary")}</button>
    </section>
  </section>
  <footer class="mk-footer">
    <span>MediKiosk · ${tr("Your health, organized.")}</span>
    <span><button class="text-btn" id="footer-signin">${t("signIn")}</button><button class="text-btn" id="footer-help">${tr("Help & privacy")}</button></span>
  </footer>
  `);
  document.documentElement.removeAttribute("data-language-pending");

  const start = () => location.href = "interview.html";
  document.getElementById("st").onclick = start;
  document.getElementById("card-hist").onclick = start;
  document.getElementById("card-time").onclick = () => location.href = "timeline.html";
  document.getElementById("card-sum").onclick = () => location.href = "summary.html";
  document.getElementById("footer-signin").onclick = () => location.href = "login.html";
  document.getElementById("footer-help").onclick = () => location.href = "index.html#about";
  ["card-time"].forEach(id => document.getElementById(id).onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById(id).click(); }
  });
}

async function homeDash() {
  const cta = interviewCta();
  const canSummary = Object.keys(ans).some(k => k !== "_ay");
  const greetingName = me.name ? `, ${esc(me.name.split(" ")[0])}` : "";

  R(`
  <section class="mk-home" aria-labelledby="hero-title">
    <p class="mk-greeting">${tr("Good morning")}${greetingName} <span aria-hidden="true">👋</span></p>
    <h1 id="hero-title">${t("welcome")}</h1>
    <p class="mk-intro">${t("sub")}</p>
    <div class="hero-actions mk-landing-actions">
      <button class="btn btn-lg" id="hero-start">${t("start")}</button>
    </div>
    <article class="mk-feature-card">
      <div class="mk-feature-icon">${ICONS.history}</div>
      <div class="mk-feature-copy">
        <h2>${tr("Medical history")}</h2>
        <p>${tr("Answer a few questions about your health.")}</p>
      </div>
      <div class="mk-progress" aria-live="polite">
        <span class="mk-progress-label">${hasInterviewProgress() ? tr("In progress") : tr("Not started")}</span>
      </div>
      <button class="btn mk-feature-action" id="st">${cta}<span aria-hidden="true">→</span></button>
    </article>
    <div class="mk-support-grid">
      <article class="mk-support-card" id="card-time" role="button" tabindex="0">
        <div class="mk-support-icon">${ICONS.timeline}</div>
        <h2>${tr("Health timeline")}</h2>
        <p>${tr("Review your recorded history.")}</p>
      </article>
    </div>
    <div class="mk-home-secondary">
      <button class="text-btn" id="card-sum">${tr("View health summary")}</button>
    </div>
  `);

  const startIv = () => hasInterviewProgress() ? ask() : setup();
  document.getElementById("st").onclick = startIv;
  document.getElementById("hero-start").onclick = startIv;
  document.getElementById("card-time").onclick = dashHistory;
  ["card-time"].forEach(id => document.getElementById(id).onkeydown = e => {
    if (e.key === "Enter" || e.key === " ") { e.preventDefault(); document.getElementById(id).click(); }
  });
  document.getElementById("card-sum").onclick = () => {
    if (canSummary) summaryPage();
    else showToast(tr("A draft summary is available after you complete a history interview in this session."));
  };
}

async function dashHistory() {
  if (!TOKEN) { auth(); return; }
  try { me = await api("/me"); } catch (e) { auth(); return; }
  let rs = [];
  try { rs = await api("/records"); } catch (e) {}
  const PL = ["", "Emergency", "Urgent", "Routine"].map(value => value ? tr(value) : "");
  setActive("bn-hist");
  R(`
  <div class="mt">
    <p class="eyebrow">${tr("Records")}</p>
    <h1>${t("dash")}</h1>
    <p class="subtitle">${esc(me.name || me.username)}</p>
  </div>
  <div class="card mt">
    ${rs.length ? `
    <div class="table-wrap"><table class="stack-table">
      <thead><tr><th>${tr("Token")}</th><th>${tr("Date")}</th><th>${tr("Priority")}</th><th>${tr("Status")}</th><th>${tr("ABDM")}</th></tr></thead>
      <tbody>${rs.map(r => `<tr>
        <td data-label="${tr("Token")}"><b>${r.token_no}</b></td>
        <td data-label="${tr("Date")}">${new Date(r.created*1000).toLocaleDateString(lang === "hi" ? "hi-IN" : "en-IN",{day:"numeric",month:"short",year:"2-digit"})}</td>
        <td data-label="${tr("Priority")}"><span class="chip chip-${["","emergency","urgent","routine"][r.priority]}">${PL[r.priority]}</span></td>
        <td data-label="${tr("Status")}">${esc(tr(r.status))}</td>
        <td data-label="${tr("ABDM")}" class="mut">${esc(r.abdm_ref || "—")}</td>
      </tr>`).join("")}</tbody>
    </table></div>` : `<p class="mut center" style="padding:24px">${t("noRecords")}</p>`}
  </div>
  <button class="btn btn-block mt" id="st">${interviewCta()}</button>
  `);
  document.getElementById("st").onclick = () => hasInterviewProgress() ? ask() : setup();
}

function aboutPage() {
  setActive("bn-info");
  R(`
  <div class="mt">
    <p class="eyebrow">MediKiosk</p>
    <h1>${tr("About and help")}</h1>
    <p class="subtitle">${tr("Your health, organized.")} Smart India Hackathon · Problem Statement 4 · Ministry of Ayush / AIIA</p>
  </div>
  <div class="card mt">
    <h2>${tr("How this kiosk helps")}</h2>
    <p class="mt-sm">${tr("Patients complete a guided history and can upload reports before seeing a clinician. The clinician receives a structured draft for review. This software does not diagnose or replace clinical judgement.")}</p>
  </div>
  <div class="card">
    <h2>${tr("Privacy")}</h2>
    <p class="mt-sm">${tr("Before an interview starts, you are asked for explicit consent to record health information for your doctor. Guest working documents are removed after submission while source-linked encounter evidence remains available for doctor review. Data deletion is available from your account. ABDM sharing is not an operational integration in this application.")}</p>
  </div>
  <div class="card">
    <h2>${tr("Clinical support components")}</h2>
    <div class="timeline mt-sm">
      <div class="timeline-item"><div class="timeline-dot"></div>
        <div class="timeline-title">${tr("Adaptive medical history")}</div>
        <div class="timeline-body">${tr("Ontology-constrained, stateful question selection. MediTOD (EMNLP 2024) is a relevant published benchmark candidate; the current policy is not a trained model.")}</div>
      </div>
      <div class="timeline-item"><div class="timeline-dot"></div>
        <div class="timeline-title">${tr("Clinical documentation")}</div>
        <div class="timeline-body">${tr("Structured, source-aware summaries with a separate validation step.")}</div>
      </div>
      <div class="timeline-item"><div class="timeline-dot warn"></div>
        <div class="timeline-title">${tr("Safety and limitations")}</div>
        <div class="timeline-body">${tr("Red-flag rules are a provisional decision-support layer requiring clinical validation. Synthetic datasets are for software testing, not evidence of clinical performance.")}</div>
      </div>
    </div>
    <p class="mut caption mt-sm">Research: <a href="https://aclanthology.org/2024.emnlp-main.936/" target="_blank" rel="noopener">MediTOD (2024)</a> · <a href="https://aclanthology.org/2025.nlpai4health-main.10/" target="_blank" rel="noopener">NLP4Health (2025)</a> · <a href="https://tech.abridge.com/blog/real-time-error-detection-and-correction" target="_blank" rel="noopener">Abridge Editors (2026)</a></p>
  </div>
  <p class="mut caption center mt">${tr("Not clinically validated. For evaluation and software testing.")}</p>
  `);
}

let lastN = null;
async function startInterviewSession() {
  setActive("bn-home");
  try {
    const n = await api("/interview/sessions", { method: "POST", json: { budget: 30, ayush }});
    interviewSessionId = n.session_id; lastN = n; persistInterview();
    if (n.complete) return docs();
    draw(n);
  } catch (e) {
    showToast(lang === "hi" ? `अनुकूलित साक्षात्कार शुरू नहीं हो सका: ${patientError(e)}` : `Adaptive interview could not start: ${patientError(e)}`);
    interviewSessionId = null;
    const n = await api("/interview/next", { json: { answers: ans, ayush }});
    lastN = n; if (n.complete) return docs(); draw(n);
  }
}
async function rebuildInterviewSession(drawIt = true) {
  const created = await api("/interview/sessions", { method: "POST", json: { budget: 30, ayush }});
  interviewSessionId = created.session_id;
  let response = created;
  for (const [field, value] of Object.entries(ans)) {
    if (field === "_ay") continue;
    response = await api("/interview/sessions/" + encodeURIComponent(interviewSessionId) + "/answers", { method: "POST", json: { field, value }});
  }
  lastN = response;
  persistInterview();
  if (response.complete) return docs();
  if (drawIt) draw(response);
}
async function ask() {
  setActive("bn-home");
  restoreInterview();
  if (!interviewSessionId) return startInterviewSession();
  try { const n = await api("/interview/sessions/" + encodeURIComponent(interviewSessionId)); lastN = n; if (n.complete) return docs(); draw(n); }
  catch (e) { showToast(lang === "hi" ? `साक्षात्कार लोड नहीं हो सका: ${patientError(e)}` : `Could not load interview: ${patientError(e)}`); startInterviewSession(); }
}

function draw(n) {
  cur = n.question;
  const q = cur, l = lang === "en" ? "en" : "hi";
  answerSaving = false;
  voiceNeedsConfirmation = false;
  voiceRetryCount = 0;
  const runId = ++voiceRunId;
  const showProgress = Number(n.total) > 0;
  const pct = showProgress ? Math.round(n.answered / n.total * 100) : 0;
  const flagsBanner = n.red_flags.length ? `
    <div class="alert alert-emergency" role="alert">
      <span class="alert-icon">Urgent</span>
      <div><b>${t("flag")}</b><br>${n.red_flags.map(f => esc(f.msg)).join("<br>")}</div>
    </div>` : "";

  const micControl = inputMode === "voice" ? "" : `<button class="mic-btn" id="mic" type="button">${t("speak")}</button>`;
  const body = q.type === "text"
    ? `<label class="input-label" for="tx">${t("type")}</label>
       <textarea id="tx">${esc(ans[q.id] || "")}</textarea>
       <div class="skip-row">
         <button type="button" class="btn btn-text" data-skip="Not sure">${t("notSure")}</button>
         <button type="button" class="btn btn-text" data-skip="Prefer not to answer">${t("preferNot")}</button>
       </div>
       ${micControl}
       <span class="mut" id="heard" style="display:block;margin-top:8px"></span>`
    : `<div class="opts" role="group" aria-label="${esc(q[l])}">${q.options.map(o => {
        const sel = q.type === "multi" ? (ans[q.id] || []).includes(o.v) : ans[q.id] === o.v;
        return `<button class="opt${sel ? " sel" : ""}" data-v="${esc(o.v)}" aria-pressed="${sel}" type="button">${esc(o[l])}</button>`;
      }).join("")}</div>
      ${micControl}
      <span class="mut" id="heard" style="display:block;margin-top:8px"></span>`;

  R(`
  ${flagsBanner}
  <div class="card mt">
    ${inputMode === "voice" ? `<div class="voice-toolbar" aria-label="${t("voiceStateReady")}">
      <span class="voice-state-indicator" id="voice-state" role="status" aria-live="polite"></span>
      <button class="btn btn-outline btn-sm" id="voice-pause" type="button">${t("pauseInterview")}</button>
      <button class="btn btn-outline btn-sm" id="voice-fallback" type="button">${t("changeMode")}</button>
      <button class="btn btn-outline btn-sm" id="voice-stop" type="button">${t("stopInterview")}</button>
    </div>` : ""}
    <div class="row" style="justify-content:space-between;margin-bottom:6px">
      <span class="caption">${esc(localizedSection(q.section))}</span>
      ${showProgress ? `<span class="caption">${n.answered}/${n.total}</span>` : ""}
    </div>
    ${showProgress ? `<div class="progress-bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><div class="progress-fill" style="width:${pct}%"></div></div>` : ""}
    <h1 style="margin:14px 0 8px;font-size:1.35rem">${esc(q[l])}</h1>
    ${body}
    <div class="row sticky-actions mt" style="justify-content:space-between">
      <button class="btn btn-outline" id="bk" type="button">${t("back")}</button>
      <button class="btn btn-outline" id="repeat-question" type="button">${t("repeatQuestion")}</button>
      <button class="btn" id="nx" type="button">${t(voiceNeedsConfirmation ? "confirmAnswer" : "next")}</button>
    </div>
  </div>`);
  const questionKey = q.id + ":" + lang;
  if (inputMode === "voice") {
    setVoiceState("ASKING_QUESTION");
    speakQuestion(q[l], runId);
  } else if (spokenQuestionKey !== questionKey) {
    spokenQuestionKey = questionKey;
    say(q[l]);
  }

  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    if (inputMode === "voice") {
      voiceRunId += 1;
      if (_rec) { try { _rec.abort(); } catch (_) {} _rec = null; }
    }
    const v = b.dataset.v;
    if (q.type === "multi") {
      let a = (ans[q.id] || []).filter(x => x !== "None");
      if (v === "None") a = ["None"];
      else a = a.includes(v) ? a.filter(x => x !== v) : [...a, v];
      ans[q.id] = a; persistInterview();
      if (inputMode === "voice") {
        document.querySelectorAll(".opt").forEach(optionButton => {
          const selected = a.includes(optionButton.dataset.v);
          optionButton.classList.toggle("sel", selected);
          optionButton.setAttribute("aria-pressed", String(selected));
        });
        voiceNeedsConfirmation = true;
        setVoiceState("VERIFYING_ANSWER");
        document.getElementById("nx").textContent = t("confirmAnswer");
      } else draw(lastN);
    } else {
      ans[q.id] = v; persistInterview();
      if (inputMode === "voice") {
        voiceNeedsConfirmation = true;
        setVoiceState("VERIFYING_ANSWER");
        document.getElementById("nx").textContent = t("confirmAnswer");
      } else adv();
    }
  });
  document.querySelectorAll("[data-skip]").forEach(b => b.onclick = () => {
    const tx = document.getElementById("tx");
    if (tx) tx.value = b.dataset.skip;
  });
  document.getElementById("mic")?.addEventListener("click", () => listenVoice(q));
  document.getElementById("repeat-question").onclick = () => {
    if (inputMode === "voice") repeatVoiceQuestion(q, l);
    else say(q[l]);
  };
  document.getElementById("voice-pause")?.addEventListener("click", () => {
    if (voiceState === "PAUSED") resumeVoiceQuestion(q, l);
    else pauseVoiceInterview();
  });
  document.getElementById("voice-stop")?.addEventListener("click", stopVoiceInterview);
  document.getElementById("voice-fallback")?.addEventListener("click", switchToClickMode);
  document.getElementById("bk").onclick = async () => {
    const p = stack.pop();
    if (p) {
      persistInterview();
      const kept = ans[p];
      delete ans[p];
      try {
        await rebuildInterviewSession(false);
        if (kept !== undefined) ans[p] = kept;
        persistInterview();
        if (lastN) draw(lastN);
      } catch (e) {
        if (kept !== undefined) ans[p] = kept;
        showToast(lang === "hi" ? `पिछले प्रश्न पर नहीं लौट सके: ${patientError(e)}` : `Could not return to previous question: ${patientError(e)}`);
      }
    } else { interviewSessionId = null; persistInterview(); setup(); }
  };
  document.getElementById("nx").onclick = async () => {
    if (answerSaving) return;
    if (q.type === "text") ans[q.id] = document.getElementById("tx").value.trim();
    else if (q.type === "multi" && !(ans[q.id] || []).length) ans[q.id] = ["None"];
    else if (!ans[q.id]) { showToast(t("enterAnswer")); return; }
    if (inputMode === "voice" && voiceNeedsConfirmation && q.type !== "text" && !ans[q.id]) {
      showToast(t("enterAnswer")); return;
    }
    persistInterview();
    answerSaving = true;
    setVoiceState("SAVING_ANSWER");
    if (inputMode === "voice" && pendingVoiceTranscript) await voiceTranscriptPromise;
    if (transcriptPersistenceFailed && pendingVoiceTranscript) {
      try {
        const saved = await saveVoiceTranscript(pendingVoiceTranscript);
        voiceTranscriptId = saved.transcript_id;
        voiceTranscriptOriginal = saved.original_transcript;
        voiceTranscriptPromise = Promise.resolve(saved);
        transcriptPersistenceFailed = false;
      } catch (e) {
        showToast(lang === "hi"
          ? "बोला गया उत्तर सुरक्षित नहीं हो सका। फिर कोशिश करें या क्लिक/टैप तरीके पर जाएँ।"
          : "The spoken answer could not be saved. Retry or switch to Click/Tap Mode.");
        setVoiceState("TRANSCRIPTION_ERROR");
        answerSaving = false;
        return;
      }
    }
    const corrected = selectedAnswerText(q);
    const transcriptId = voiceTranscriptId;
    if (transcriptId) pendingAnswerTranscriptId = transcriptId;
    voiceNeedsConfirmation = false;
    answerSaving = true;
    setVoiceState("SAVING_ANSWER");
    (async () => {
      if (transcriptId && corrected && voiceTranscriptOriginal && corrected !== voiceTranscriptOriginal) {
        try { await api("/asr/transcripts/" + transcriptId, { method: "PUT", json: { corrected_transcript: corrected }}); }
        catch (e) {
          showToast(lang === "hi"
            ? "सुधारा हुआ उत्तर सुरक्षित नहीं हो सका। साक्षात्कार का उत्तर अभी इस स्क्रीन पर बना हुआ है।"
            : "The corrected transcript could not be saved. Your interview answer remains on this screen.");
          answerSaving = false;
          return;
        }
      }
      adv(true);
    })();
  };
}

async function adv(verified = false) {
  if (answerSaving && !verified) return;
  if (!cur) return;
  answerSaving = true;
  setVoiceState("SAVING_ANSWER");
  stack.push(cur.id);
  persistInterview();
  if (!interviewSessionId) { answerSaving = false; return ask(); }
  const value = ans[cur.id];
  try {
    await voiceTranscriptPromise;
    const n = await api("/interview/sessions/" + encodeURIComponent(interviewSessionId) + "/answers", {
      method: "POST",
      json: {
        field: cur.id,
        value: value === undefined ? "" : value,
        transcript_id: pendingAnswerTranscriptId,
        language: lang,
        verification_status: pendingAnswerTranscriptId ? "patient_confirmed" : "patient_submitted"
      }
    });
    lastN = n;
    voiceTranscriptId = null;
    voiceTranscriptOriginal = "";
    pendingVoiceTranscript = "";
    pendingAnswerTranscriptId = null;
    persistInterview();
    answerSaving = false;
    if (n.complete) { setVoiceState("INTERVIEW_COMPLETE"); return docs(); }
    setVoiceState("NEXT_QUESTION");
    draw(n);
  } catch (e) {
    stack.pop(); answerSaving = false; persistInterview();
    showToast(lang === "hi" ? `उत्तर सुरक्षित नहीं हो सका: ${patientError(e)}` : `Could not save this answer: ${patientError(e)}`);
  }
}

function localizedSection(section) {
  const translations = {
    "Chief complaint": "sectionChief", "HPI": "sectionHpi", "HPI (fever)": "sectionHpi",
    "HPI (respiratory)": "sectionHpi", "HPI (abdomen)": "sectionHpi",
    "HPI (headache)": "sectionHpi", "HPI (musculoskeletal)": "sectionHpi",
    "SOCRATES": "sectionSoc", "Associated symptoms": "sectionAssociated",
    "Past medical / surgical": "sectionHistory", "Medications / allergies": "sectionMedication",
    "AYUSH": "sectionAyush"
  };
  return translations[section] ? t(translations[section]) : section;
}
function selectedAnswerText(q) {
  const value = ans[q.id];
  if (q.type === "text") return String(value || "").trim();
  const values = Array.isArray(value) ? value : value == null ? [] : [value];
  return values.map(item => {
    const option = (q.options || []).find(candidate => candidate.v === item);
    return option ? option[lang === "hi" ? "hi" : "en"] || option.v : item;
  }).join(", ");
}
function speakQuestion(text, runId, repeating = false) {
  if (runId !== voiceRunId || inputMode !== "voice") return;
  if (repeating) setVoiceState("REPEATING_QUESTION");
  setVoiceState("SPEAKING_QUESTION");
  say(text, () => {
    if (runId !== voiceRunId || inputMode !== "voice" || voiceState === "PAUSED") return;
    setVoiceState("WAITING_FOR_SPEECH");
    listenVoice(cur, true, "answer", runId);
  });
}
function repeatVoiceQuestion(q, language) {
  voiceRunId += 1;
  if (_rec) { try { _rec.abort(); } catch (_) {} _rec = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  speakQuestion(q[language], voiceRunId, true);
}
function pauseVoiceInterview() {
  voiceRunId += 1;
  if (_rec) { try { _rec.abort(); } catch (_) {} _rec = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  setVoiceState("PAUSED");
}
function resumeVoiceQuestion(q, language) {
  setVoiceState("READY");
  speakQuestion(q[language], ++voiceRunId, true);
}
function switchToClickMode() {
  voiceRunId += 1;
  if (_rec) { try { _rec.abort(); } catch (_) {} _rec = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  inputMode = "click";
  localStorage.setItem("mk_input_mode", inputMode);
  persistInterview();
  if (lastN) draw(lastN);
}
function stopVoiceInterview() {
  voiceRunId += 1;
  if (_rec) { try { _rec.abort(); } catch (_) {} _rec = null; }
  if (window.speechSynthesis) speechSynthesis.cancel();
  inputMode = "click";
  localStorage.setItem("mk_input_mode", inputMode);
  persistInterview();
  showToast(lang === "hi"
    ? "साक्षात्कार रोक दिया गया है। आपकी प्रगति सुरक्षित है।"
    : "The interview has stopped. Your progress is saved.");
  homeDash();
}
function handleVoiceCommand(command, q, language) {
  const normalized = command.trim().toLocaleLowerCase().replace(/[.,!?।]/g, "");
  const groups = lang === "hi" ? {
    confirm: ["पुष्टि", "पुष्टि करें", "स्वीकार", "ठीक है"],
    correct: ["सुधार", "सुधारें", "बदलें", "गलत"],
    repeat: ["दोहराएँ", "दोहराओ", "फिर से", "प्रश्न दोहराएँ"],
    pause: ["रोकें", "रुकें", "विराम"],
    resume: ["जारी रखें", "फिर शुरू करें", "शुरू करें"],
    stop: ["बंद करें", "समाप्त", "रोक दें"]
  } : {
    confirm: ["confirm", "confirm answer", "accept"],
    correct: ["correct", "change", "edit"],
    repeat: ["repeat", "repeat question", "again"],
    pause: ["pause", "pause interview"],
    resume: ["resume", "resume interview"],
    stop: ["stop", "stop interview"]
  };
  const action = Object.entries(groups).find(([, words]) => words.includes(normalized))?.[0];
  if (action === "confirm") {
    if (q.type !== "text" && !ans[q.id]) {
      setVoiceState("VERIFYING_ANSWER");
      showToast(t("enterAnswer"));
      return;
    }
    document.getElementById("nx")?.click();
  } else if (action === "correct") {
    if (q.type === "text") {
      const field = document.getElementById("tx");
      if (field) { field.focus(); field.select(); }
    }
    setVoiceState("VERIFYING_ANSWER");
    if (inputMode === "voice") listenVoice(q, true, "answer", voiceRunId);
  } else if (action === "repeat") {
    speakQuestion(q[language], ++voiceRunId);
  } else if (action === "pause") {
    pauseVoiceInterview();
  } else if (action === "resume" && voiceState === "PAUSED") {
    resumeVoiceQuestion(q, language);
  } else if (action === "stop") {
    stopVoiceInterview();
  } else {
    setVoiceState("VERIFYING_ANSWER");
    const heard = document.getElementById("heard");
    if (heard) heard.textContent = lang === "hi"
      ? "आदेश स्पष्ट नहीं था। पुष्टि, सुधार, दोहराएँ, रोकें या बंद करें कहें।"
      : "Command not recognized. Say confirm, correct, repeat, pause, or stop.";
  }
}
function listenVoice(q, allowRetry = true, purpose = "answer", runId = voiceRunId) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) {
    setVoiceState("MICROPHONE_ERROR");
    showToast(t("unsupportedLanguage"));
    return;
  }
  if (runId !== voiceRunId || (inputMode === "voice" && voiceState === "PAUSED")) return;
  if (_rec) { try { _rec.abort(); } catch (_) {} _rec = null; }
  const r = new SR(); _rec = r;
  r.lang = lang === "hi" ? "hi-IN" : "en-IN";
  r.continuous = false; r.interimResults = true; r.maxAlternatives = 3;
  const btn = document.getElementById("mic");
  const heard = document.getElementById("heard");
  if (btn) { btn.classList.add("listening"); btn.disabled = true; btn.textContent = t("listen"); }
  if (purpose === "answer") setVoiceState("LISTENING");
  if (heard) heard.textContent = t("listen");
  let finalTranscript = "";
  let recognitionError = false;
  let recognitionErrorCode = "";
  let handled = false;
  let interpretationMatched = false;
  const finish = () => {
    if (btn) { btn.classList.remove("listening"); btn.disabled = false; btn.textContent = t("speak"); }
    if (_rec === r) _rec = null;
  };
  r.onresult = e => {
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const text = (e.results[i][0]?.transcript || "").trim();
      if (e.results[i].isFinal) finalTranscript += (finalTranscript ? " " : "") + text;
      else interim += (interim ? " " : "") + text;
    }
    const spoken = (finalTranscript || interim).trim();
    if (heard && spoken) heard.textContent = `${t("transcriptLabel")}: “${spoken}”`;
  };
  r.onerror = e => {
    recognitionError = true;
    recognitionErrorCode = e.error;
    finish();
    if (e.error === "network" && allowRetry) {
      handled = true;
      if (heard) heard.textContent = lang === "hi" ? "वाक् सेवा उपलब्ध नहीं है। एक बार फिर कोशिश हो रही है…" : "Speech service is unavailable. Retrying once…";
      setTimeout(() => listenVoice(q, false, purpose, runId), 350);
      return;
    }
    const messages = lang === "hi" ? {
      "not-allowed": "माइक्रोफ़ोन की अनुमति नहीं मिली। ब्राउज़र सेटिंग में अनुमति दें।",
      "service-not-allowed": "ब्राउज़र की वाक् सेवा बंद है। क्लिक/टैप तरीके पर जाएँ।",
      "no-speech": t("noSpeech"), "audio-capture": "माइक्रोफ़ोन नहीं मिला या व्यस्त है।",
      "language-not-supported": t("unsupportedLanguage"), "network": "वाक् सेवा उपलब्ध नहीं है। क्लिक/टैप तरीके पर जाएँ।"
    } : {
      "not-allowed": "Microphone permission was denied. Allow it in browser settings.",
      "service-not-allowed": "The browser speech service is blocked. Switch to Click/Tap Mode.",
      "no-speech": t("noSpeech"), "audio-capture": "No microphone was found or it is busy.",
      "language-not-supported": t("unsupportedLanguage"), "network": "The browser speech service is unavailable. Switch to Click/Tap Mode."
    };
    if (heard) heard.textContent = messages[e.error] || (lang === "hi" ? "वाक् पहचान विफल हुई। फिर कोशिश करें या क्लिक/टैप तरीका चुनें।" : "Speech recognition failed. Retry or switch to Click/Tap Mode.");
    setVoiceState(e.error === "no-speech" ? "TRANSCRIPTION_ERROR" : "MICROPHONE_ERROR");
  };
  r.onend = async () => {
    finish();
    if (handled || runId !== voiceRunId) return;
    handled = true;
    const transcript = finalTranscript.trim();
    if (purpose === "command") {
      if (transcript) handleVoiceCommand(transcript, q, lang === "hi" ? "hi" : "en");
      else setVoiceState("VERIFYING_ANSWER");
      return;
    }
    if (!transcript) {
      if (heard && !recognitionError) heard.textContent = t("noSpeech");
      if (inputMode === "voice" && (!recognitionError || recognitionErrorCode === "no-speech") && voiceRetryCount === 0) {
        voiceRetryCount += 1;
        speakQuestion(q[lang === "hi" ? "hi" : "en"], ++voiceRunId);
      } else if (inputMode === "voice") {
        setVoiceState("TRANSCRIPTION_ERROR");
        if (heard) heard.textContent = lang === "hi"
          ? "आवाज़ नहीं मिली। प्रश्न दोहराएँ, फिर कोशिश करें या क्लिक/टैप तरीका चुनें।"
          : "No speech was detected. Repeat the question, try again, or switch to Click/Tap Mode.";
      }
      return;
    }

    if (q.type === "text") {
      const tx = document.getElementById("tx");
      if (tx) tx.value = transcript;
      ans[q.id] = transcript;
    } else {
      const normalize = value => String(value).trim().toLocaleLowerCase().replace(/[.,!?।]/g, "");
      const normalized = normalize(transcript);
      const exact = (q.options || []).find(option =>
        [option.en, option.hi, option.v].some(value => value && normalize(value) === normalized)
      );
      if (exact) {
        interpretationMatched = true;
        if (q.type === "multi") ans[q.id] = [exact.v];
        else ans[q.id] = exact.v;
        document.querySelectorAll(".opt").forEach(optionButton => {
          const selected = q.type === "multi" ? ans[q.id].includes(optionButton.dataset.v) : ans[q.id] === optionButton.dataset.v;
          optionButton.classList.toggle("sel", selected);
          optionButton.setAttribute("aria-pressed", String(selected));
        });
      } else {
        delete ans[q.id];
        if (heard) heard.textContent = t("clarificationPrompt");
      }
    }
    voiceNeedsConfirmation = true;
    setVoiceState("TRANSCRIBING");
    persistInterview();
    if (heard) heard.textContent = `${t("transcriptLabel")}: “${transcript}”`;
    pendingVoiceTranscript = transcript;
    transcriptPersistenceFailed = false;
    voiceTranscriptPromise = saveVoiceTranscript(transcript).then(saved => {
      voiceTranscriptId = saved.transcript_id;
      voiceTranscriptOriginal = saved.original_transcript;
      return saved;
    }).catch(error => {
      transcriptPersistenceFailed = true;
      if (heard) heard.textContent = `${t("transcriptLabel")}: “${transcript}” — ${lang === "hi" ? "सुरक्षित नहीं हुआ; पुष्टि से पहले फिर कोशिश करें।" : "not saved; retry before confirming."}`;
      setVoiceState("TRANSCRIPTION_ERROR");
      console.error("Could not persist browser transcript", error);
      return null;
    });
    await voiceTranscriptPromise;
    setVoiceState(interpretationMatched || q.type === "text" ? "VERIFYING_ANSWER" : "CLARIFICATION_REQUIRED");
    const nextButton = document.getElementById("nx");
    if (nextButton) nextButton.textContent = t("confirmAnswer");
    if (inputMode === "voice" && !transcriptPersistenceFailed && runId === voiceRunId) {
      const heardValue = selectedAnswerText(q);
      const prompt = heardValue
        ? `${t("answerReadback")}: ${heardValue}. ${t("voiceCommandPrompt")}`
        : `${t("clarificationPrompt")} ${t("voiceCommandPrompt")}`;
      say(prompt, () => listenVoice(q, false, "command", runId));
    }
  };
  try { r.start(); } catch (e) {
    finish();
    if (heard) heard.textContent = lang === "hi" ? `माइक्रोफ़ोन शुरू नहीं हो सका: ${e.message}` : `Could not start microphone: ${e.message}`;
    setVoiceState("MICROPHONE_ERROR");
  }
}

function docStatus(d) {
  const ent = d.entities || {};
  if (d.processing_status === "failed") return { label: d.processing_error ? patientError(d.processing_error) : tr("Processing failed"), cls: "err" };
  if (d.processing_status === "needs_review") return { label: d.processing_error ? patientError(d.processing_error) : tr("Needs review"), cls: "warn" };
  if (!d.text) return { label: tr("Unreadable — type the contents"), cls: "err" };
  if ((ent.review_flags || []).length) return { label: tr("Needs review"), cls: "warn" };
  return { label: tr("Completed"), cls: "ok" };
}

async function docs(notice = "") {
  setActive("bn-home");
  let ds;
  try { ds = await api("/documents"); }
  catch (e) {
    R(`<div class="alert alert-urgent mt" role="alert">${tr("documentsLoadFailed")}: ${esc(patientError(e))}</div>
      <button class="btn btn-outline mt" id="docs-back" type="button">${t("back")}</button>`);
    document.getElementById("docs-back").onclick = ask;
    return;
  }
  R(`
  <div class="step-hdr mt">
    <div class="step-number">2</div>
    <div><h1>${t("docsH")}</h1><p class="subtitle">${t("docsS")}</p></div>
  </div>
  <div class="card">
    <label class="upload-zone" id="drop">
      <input type="file" id="f" accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.txt" multiple>
      <div class="action-icon" style="margin:0 auto">${ICONS.upload}</div>
      <p style="font-weight:650;margin-top:10px">${t("addDoc")}</p>
      <p class="mut">${t("uploadFileLimits")}</p>
    </label>
    <div class="row mt-sm">
      <div style="flex:1">
        <label class="input-label" for="dd">${t("date")}</label>
        <input type="text" id="dd" placeholder="YYYY-MM-DD">
      </div>
      <button class="btn" id="up" type="button">${t("upload")}</button>
    </div>
    <p id="upst" class="mut" aria-live="polite">${esc(notice)}</p>
    <div class="auth-divider">${t("or")}</div>
    <label class="input-label" for="tt">${t("or")}</label>
    <textarea id="tt" placeholder="${t("typeReportText")}"></textarea>
    <button class="btn btn-outline btn-block" id="ta" type="button">${t("add")}</button>
  </div>
  ${ds.length ? `
  <p class="label mt">${tr("uploadedDocuments")}</p>
  <div class="doc-list">
    ${ds.map(d => {
      const ent = d.entities || { labs: [], medications: [] };
      const st = docStatus(d);
      return `<article class="doc-item">
        <details>
          <summary>
            <strong style="overflow-wrap:anywhere">${esc(d.filename)}</strong>
            <span class="mut">${esc(d.date || t("undated"))} · ${esc(tr(String(d.doc_type || "Unclassified").replaceAll("_"," ")))} · ${esc(d.engine)}</span>
            <span class="mut"><span class="status-dot ${st.cls}"></span>${esc(st.label)}</span>
          </summary>
          ${d.processing_error ? `<p class="alert alert-urgent mt-sm" role="status">${esc(patientError(d.processing_error))}</p>` : ""}
          ${(ent.review_flags || []).length ? `<p class="caption">${tr("Needs review")}: ${esc(ent.review_flags.map(flag => tr(flag)).join(", "))}</p>` : ""}
          <label class="input-label" for="category-${d.id}">${tr("documentCategory")}</label>
          <div class="row">
            <select id="category-${d.id}" data-document-category="${d.id}">
              ${[["lab_report", "Laboratory report"], ["prescription", "Prescription"], ["discharge_summary", "Discharge summary"], ["other", "Other"]].map(([value, label]) => `<option value="${value}" ${d.doc_type === value ? "selected" : ""}>${tr(label)}</option>`).join("")}
            </select>
            <button class="btn btn-outline btn-sm" data-document-save-category="${d.id}" type="button">${tr("saveCategory")}</button>
          </div>
          <div class="row mt-sm">
            ${d.has_original ? `<button class="btn btn-outline btn-sm" data-download-doc="${d.id}" data-filename="${esc(d.filename)}" type="button">${t("viewDownloadOriginal")}</button>` : ""}
            ${d.processing_status === "failed" ? `<label class="btn btn-outline btn-sm">${tr("chooseDocument")}<input type="file" data-document-replacement="${d.id}" accept=".pdf,.png,.jpg,.jpeg,.webp,.tif,.tiff,.txt" hidden></label><button class="btn btn-outline btn-sm" data-document-retry="${d.id}" type="button">${tr("retryExtraction")}</button>` : ""}
            <button class="btn btn-outline btn-sm btn-danger" data-d="${d.id}" type="button">${t("removeDocument")}</button>
          </div>
          ${d.text ? `<details class="mt-sm"><summary>${tr("extractedText")}</summary><pre class="document-preview">${esc(d.text)}</pre></details>` : `<p class="caption mt-sm">${tr("noExtractedText")}</p>`}
          ${ent.diagnoses?.length ? `<p class="timeline-body">${tr("Diagnoses mentioned")}: ${ent.diagnoses.map(esc).join(", ")}</p>` : ""}
          ${(ent.medications || []).length ? `<h3>${tr("Medication mentions")}</h3><ul>${ent.medications.map(m => `<li>${esc(m.name)} ${esc(m.dose || "")} ${esc(m.frequency || "")} · ${esc(tr(m.status || "reported"))}</li>`).join("")}</ul>` : ""}
          ${(ent.allergies || []).length ? `<h3>${tr("Allergy mentions")}</h3><ul>${ent.allergies.map(item => `<li>${esc(item)}</li>`).join("")}</ul>` : ""}
          ${(ent.labs || []).length ? `<h3>${tr("Laboratory findings")}</h3><div class="table-wrap"><table class="stack-table"><thead><tr><th>${tr("Test")}</th><th>${tr("Value")}</th><th>${tr("Reference range")}</th><th>${tr("Uncertainty")}</th></tr></thead><tbody>${ent.labs.map(l => `<tr><td data-label="${tr("Test")}">${esc(l.test)}</td><td data-label="${tr("Value")}">${esc(l.value)} ${esc(l.unit || "")}</td><td data-label="${tr("Reference range")}">${esc(l.ref || tr("Not provided"))}</td><td data-label="${tr("Uncertainty")}">${esc(l.uncertainty || l.reference_source || tr("Not reported"))}</td></tr>`).join("")}</tbody></table></div>` : `<p class="caption">${tr("noFindings")}</p>`}
        </details>
      </article>`;
    }).join("")}
  </div>` : `<p class="empty-state mt">${t("nodocs")}</p>`}
  <div class="row sticky-actions mt" style="justify-content:space-between">
    <button class="btn btn-outline" id="bk" type="button">${t("back")}</button>
    <button class="btn" id="nx" type="button">${t("next")}</button>
  </div>
  `);
  say(t("docsH"));

  const drop = document.getElementById("drop");
  const fileInput = document.getElementById("f");
  const upst = document.getElementById("upst");
  fileInput.onchange = e => { upst.textContent = Array.from(e.target.files || []).map(f => f.name).join(", "); };
  ["dragenter","dragover"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.add("is-dragover"); }));
  ["dragleave","drop"].forEach(ev => drop.addEventListener(ev, e => { e.preventDefault(); drop.classList.remove("is-dragover"); }));
  drop.addEventListener("drop", e => {
    const files = Array.from(e.dataTransfer.files || []);
    if (!files.length) return;
    const dt = new DataTransfer(); files.forEach(f => dt.items.add(f)); fileInput.files = dt.files;
    upst.textContent = files.map(f => f.name).join(", ");
  });

  document.getElementById("up").onclick = async () => {
    const files = Array.from(fileInput.files || []); if (!files.length) { showToast(t("chooseAtLeastOne")); return; }
    const btn = document.getElementById("up");
    btn.disabled = true;
    upst.textContent = `${t("processingDocuments")} (${files.length})`;
    try {
      const fd = new FormData(); files.forEach(f => fd.append("files", f)); fd.append("date", document.getElementById("dd").value);
      const result = await api("/documents/batch", { body: fd });
      upst.textContent = `${result.succeeded} processed, ${result.failed} failed. Review each document status below.`;
      if (result.failed) showToast(t("someDocumentsAttention"));
      else showToast(t("documentsProcessed"));
      docs(upst.textContent);
    } catch (e) { upst.textContent = e.message; btn.disabled = false; }
  };
  document.getElementById("ta").onclick = async () => {
    const x = document.getElementById("tt").value.trim(); if (!x) return;
    await api("/documents/text", { json: { text: x, date: document.getElementById("dd").value }});
    showToast(t("added")); docs(t("added"));
  };
  document.querySelectorAll("[data-d]").forEach(b => b.onclick = async () => {
    if (!confirm(t("removeDocumentConfirm"))) return;
    b.disabled = true;
    try { await api("/documents/" + b.dataset.d, { method: "DELETE" }); showToast(tr("documentRemoved")); await docs(tr("documentRemoved")); }
    catch (e) { upst.textContent = `${tr("removalFailed")}: ${patientError(e)}`; b.disabled = false; }
  });
  document.querySelectorAll("[data-download-doc]").forEach(b => b.onclick = async () => {
    try { await downloadDocument("/documents/" + b.dataset.downloadDoc + "/file", b.dataset.filename); }
    catch (e) { showToast(patientError(e), 4000); }
  });
  document.querySelectorAll("[data-document-save-category]").forEach(b => b.onclick = async () => {
    const select = document.querySelector(`[data-document-category="${b.dataset.documentSaveCategory}"]`);
    b.disabled = true;
    try {
      await api("/documents/" + b.dataset.documentSaveCategory, { method: "PUT", json: { doc_type: select.value } });
      await docs(tr("categoryUpdated"));
    } catch (e) { upst.textContent = `${tr("categoryFailed")}: ${patientError(e)}`; b.disabled = false; }
  });
  document.querySelectorAll("[data-document-retry]").forEach(b => b.onclick = async () => {
    b.disabled = true;
    try {
      const replacement = document.querySelector(`[data-document-replacement="${b.dataset.documentRetry}"]`)?.files?.[0];
      const body = new FormData();
      if (replacement) body.append("file", replacement);
      const result = await api("/documents/" + b.dataset.documentRetry + "/retry", { method: "POST", body });
      const notice = result.processing_status === "failed"
        ? `${tr("retryFailed")}: ${patientError(result.processing_error)}`
        : tr("Document extraction retried.");
      await docs(notice);
    } catch (e) { upst.textContent = `${tr("retryFailed")}: ${patientError(e)}`; b.disabled = false; }
  });
  document.getElementById("bk").onclick = () => { const p = stack.pop(); persistInterview(); ask(); };
  document.getElementById("nx").onclick = summaryPage;
}

let SEC = [];
async function summaryPage() {
  setActive("bn-home");
  const s = await api("/summary", { json: { answers: ans, ayush, lang }});
  SEC = s.sections;
  R(`
  <div class="step-hdr mt">
    <div class="step-number">3</div>
    <div><h1>${t("sumH")}</h1><p class="subtitle">${t("sumS")}</p></div>
  </div>
  ${renderClinicalReport(s.clinical_report, { mode: "patient" })}
  <p class="mut caption mt">${esc(s.patient_message)}</p>
  <div class="row sticky-actions" style="justify-content:space-between">
    <button class="btn btn-outline" id="bk" type="button">${t("back")}</button>
    <button class="btn btn-lg" id="ok" type="button">${t("send")}</button>
  </div>
  <p id="err" class="field-error"></p>
  `);
  say(s.patient_message);
  document.getElementById("bk").onclick = docs;
  document.getElementById("ok").onclick = async () => {
    const btn = document.getElementById("ok");
    btn.disabled = true;
    try { const r = await api("/submit", { json: { answers: ans, ayush, lang }}); clearInterview(); finish(r); }
    catch (e) { document.getElementById("err").textContent = e.message; btn.disabled = false; }
  };
}

function finish(r) {
  const PL = ["", "Emergency", "Urgent", "Routine"].map(value => value ? tr(value) : "");
  R(`
  <div class="card token-card mt">
    <h1>${t("done")}</h1>
    <p class="subtitle">${t("tokenL")}</p>
    <span class="token-num">${r.token_no}</span>
    <p><span class="chip chip-${["","emergency","urgent","routine"][r.priority]}">${PL[r.priority]}</span></p>
    <p class="subtitle mt">${esc(r.patient_message)}</p>
    <p class="mut caption mt">ABDM: ${esc(r.abdm.ref)} (${esc(r.abdm.mode)})</p>
    <p class="mut caption">${t("wait")}</p>
    <button class="btn btn-lg btn-block mt" id="nw">${t("returnHome")}</button>
  </div>
  `);
  say(r.patient_message);
  document.getElementById("nw").onclick = async () => {
    if (me?.role === "guest") { setToken(""); me = null; updateHeaderAuth(); auth(); }
    else { me = await api("/me"); homeDash(); }
  };
}

restoreInterview();
route();
