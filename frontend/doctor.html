<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MediKiosk – Physician Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
/* ── Doctor-console specific ── */
.queue-card{display:flex;align-items:center;gap:14px;padding:14px;border:1px solid var(--border);border-radius:var(--r);margin-bottom:10px;background:var(--surface);box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s;cursor:pointer}
.queue-card:hover{box-shadow:var(--shadow-md);border-color:var(--primary)}
.queue-card.em{border-left:4px solid var(--danger)}
.queue-card.ur{border-left:4px solid var(--warning)}
.queue-card.ro{border-left:4px solid var(--success)}
.patient-initials{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:1.05rem;color:#fff;flex-shrink:0}
.em .patient-initials{background:var(--danger)}
.ur .patient-initials{background:var(--warning)}
.ro .patient-initials{background:var(--teal)}
.sec-edit{background:var(--surface2);border-radius:var(--r);padding:14px;margin-bottom:10px}
.sec-edit h3{font-size:.76rem;text-transform:uppercase;letter-spacing:.1em;color:var(--teal);margin-bottom:8px}
.sec-edit textarea{margin:0;font-size:.92rem;min-height:80px}
.eda-kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:10px;margin:12px 0}
.kpi-box{background:var(--primary-light);border-radius:var(--r);padding:12px;text-align:center}
.kpi-box .val{font-family:'Fraunces',serif;font-size:1.6rem;font-weight:800;color:var(--primary)}
.kpi-box .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-mid);margin-top:2px}
.kpi-box.teal{background:var(--teal-light)} .kpi-box.teal .val{color:var(--teal)}
.kpi-box.danger{background:var(--danger-light)} .kpi-box.danger .val{color:var(--danger)}
.kpi-box.warn{background:var(--warning-light)} .kpi-box.warn .val{color:var(--warning)}
.bar-chart{display:flex;gap:4px;align-items:flex-end;height:80px;margin-top:8px}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.bar-fill{width:100%;background:var(--primary);border-radius:4px 4px 0 0;min-height:4px;transition:height .4s}
.bar-lbl{font-size:.6rem;color:var(--ink-soft);text-align:center;word-break:break-all}
</style>
</head><body class="doctor-app">

<aside class="doctor-sidebar" aria-label="Physician navigation">
  <div class="doctor-sidebar-brand"><span class="sidebar-mark">DO</span><span>DigitalOwl</span></div>
  <button class="sidebar-link active" onclick="switchTab('q')">Overview</button>
  <button class="sidebar-link" onclick="switchTab('q')">Case Notes <span class="sidebar-badge">New</span></button>
  <button class="sidebar-link" onclick="switchTab('q')">Timeline</button>
  <button class="sidebar-link" onclick="switchTab('q')">Patient Queue</button>
  <button class="sidebar-link" onclick="switchTab('q')">Documents</button>
  <button class="sidebar-link" onclick="switchTab('eda')">Analytics</button>
  <button class="sidebar-link" onclick="switchTab('help')">Help</button>
</aside>

<!-- APPBAR -->
<header class="appbar">
  <div class="appbar-brand">
    <div class="avatar" style="width:36px;height:36px;font-size:.9rem">DO</div>
    <span class="appbar-logo">Physician Console</span>
  </div>
  <div class="appbar-actions">
    <button class="icon-btn" id="big" title="Larger text">A+</button>
    <button class="icon-btn" id="hc" title="High contrast">◐</button>
    <a class="btn btn-outline btn-sm" href="index.html">Patient Portal</a>
  </div>
</header>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item active" id="bn-q" onclick="switchTab('q')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 4h16v2H4zm0 4h16v2H4zm0 4h10v2H4zm0 4h7v2H4z"/></svg>
    Queue
  </button>
  <button class="nav-item" id="bn-eda" onclick="switchTab('eda')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm-7 14l-5-5 1.41-1.41L12 14.17l7.59-7.59L21 8l-9 9z"/></svg>
    Analytics
  </button>
  <button class="nav-item" id="bn-help" onclick="switchTab('help')">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
    Help
  </button>
</nav>

<main class="page" id="app"></main>

<script src="common.js"></script>
<script>
a11y();
const R = h => document.getElementById("app").innerHTML = h;
const PL = ["", "Emergency", "Urgent", "Routine"];
const CHIP = ["", "chip-emergency", "chip-urgent", "chip-routine"];
const ICON = ["", "Emergency", "Urgent", "Routine"];
const QCLS = ["", "em", "ur", "ro"];
let timer, currentTab = "q";

function switchTab(tab) {
  currentTab = tab;
  ["q","eda","help"].forEach(t => {
    const el = document.getElementById("bn-" + t);
    if (el) el.classList.toggle("active", t === tab);
  });
  if (tab === "q") TOKEN ? queue() : login();
  else if (tab === "eda") TOKEN ? edaPage() : login();
  else helpPage();
}

// ─── Login ────────────────────────────────────────────────────────────────
function login(msg = "") {
  clearInterval(timer);
  R(`
  <div class="card mt" style="max-width:400px;margin:40px auto">
    <div style="text-align:center;margin-bottom:20px">
      <div class="avatar" style="width:60px;height:60px;font-size:1.2rem;margin:0 auto">PC</div>
      <h2 style="margin-top:12px">Doctor Login</h2>
      <p class="subtitle">Secure access to patient queue</p>
    </div>
    <label class="input-label">Username</label>
    <input type="text" id="u" autocomplete="username">
    <label class="input-label">Password</label>
    <input type="password" id="p" autocomplete="current-password">
    <button class="btn btn-lg btn-block mt" id="go">Log in →</button>
    ${msg ? `<p style="color:var(--danger);margin-top:10px;font-size:.88rem">${esc(msg)}</p>` : ""}
    <p class="mut caption mt center">Use the credentials configured by your system administrator.</p>
  </div>`);
  document.getElementById("p").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("go").click(); });
  document.getElementById("go").onclick = async () => {
    try {
      const r = await api("/auth/login", { json: { username: document.getElementById("u").value, password: document.getElementById("p").value }});
      if (r.role !== "doctor") { login("Not a doctor account"); return; }
      setToken(r.token); queue();
    } catch(e) { login(e.message); }
  };
}

// ─── Queue ────────────────────────────────────────────────────────────────
async function queue() {
  clearInterval(timer);
  let rs;
  try { rs = await api("/doctor/records"); }
  catch(e) { login(); return; }

  const em = rs.filter(r => r.priority === 1);
  const ur = rs.filter(r => r.priority === 2);
  const ro = rs.filter(r => r.priority === 3);

  R(`
  <div class="mt">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h2>Patient Queue</h2>
        <p class="subtitle">Auto-refreshes · Emergency first</p>
      </div>
      <button class="btn btn-outline btn-sm" id="lo">Log out</button>
    </div>
  </div>

  <!-- Queue KPIs -->
  <div class="eda-kpi">
    <div class="kpi-box danger"><div class="val">${em.length}</div><div class="lbl">Emergency</div></div>
    <div class="kpi-box warn"><div class="val">${ur.length}</div><div class="lbl">Urgent</div></div>
    <div class="kpi-box teal"><div class="val">${ro.length}</div><div class="lbl">Routine</div></div>
  </div>

  ${!rs.length ? `<div class="card center" style="padding:40px"><p class="subtitle">No patients yet</p><p class="mut">Queue updates automatically</p></div>` : ""}
  
  ${em.length ? `<p class="label" style="color:var(--danger);margin-bottom:8px">Emergency</p>${em.map(qCard).join("")}` : ""}
  ${ur.length ? `<p class="label" style="color:var(--warning);margin:12px 0 8px">Urgent</p>${ur.map(qCard).join("")}` : ""}
  ${ro.length ? `<p class="label" style="margin:12px 0 8px">Routine</p>${ro.map(qCard).join("")}` : ""}
  `);

  document.getElementById("lo").onclick = () => { setToken(""); login(); };
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openRecord(b.dataset.id));
  timer = setInterval(() => { if (!document.querySelector(".sec-edit")) queue(); }, 15000);
}

function qCard(r) {
  const initials = (r.patient || "?").split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2) || "?";
  return `<div class="queue-card ${QCLS[r.priority]}" data-id="${r.id}">
    <div class="patient-initials">${initials}</div>
    <div style="flex:1;min-width:0">
      <div class="row" style="justify-content:space-between;flex-wrap:nowrap">
        <span style="font-weight:700">${esc(r.patient || "Anonymous")}</span>
        <span class="chip ${CHIP[r.priority]}">${ICON[r.priority]} ${PL[r.priority]}</span>
      </div>
      <div class="mut">Token #${r.token_no} · ${r.status}</div>
      ${r.flags?.length ? `<div style="font-size:.82rem;color:var(--danger);margin-top:3px">${r.flags.map(f => esc(f.code)).join(" · ")}</div>` : ""}
    </div>
    <svg viewBox="0 0 24 24" fill="currentColor" style="width:20px;color:var(--ink-soft);flex-shrink:0"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/></svg>
  </div>`;
}

// Older records may not contain a screening result; distinguish that from no findings.
function legacyReportHtml(r) {
  return `<section class="rep-card" id="clinical-summary" data-block="clinical_summary"><h2>Clinical Summary</h2>
    <p class="caption">Legacy record without a stored report; draft sections below.</p>
    ${r.sections.map((s, i) => `<div class="sum-sec"><h3>${esc(s.title)}</h3><textarea data-i="${i}">${esc(s.text)}</textarea></div>`).join("")}</section>
  <section class="rep-card rf-section" id="red-flag-suggestions" data-block="red_flag_suggestions"><h2>${RF_LABEL}</h2>
    <p class="rf-notice"><b>${RF_NOTICE}</b></p>
    <div class="rf-state rf-unavailable" role="alert"><div><b>Screening unavailable or incomplete</b><br>${RF_UNAVAILABLE}</div></div></section>
  <section class="rep-card" id="clinician-review"><div class="row" style="flex-wrap:wrap">
    <button class="btn btn-teal" id="cf">Approve summary</button><button class="btn btn-outline" id="rj">Reject</button></div></section>`;
}

// ─── Record view ──────────────────────────────────────────────────────────
async function openRecord(id) {
  clearInterval(timer);
  const r = await api("/doctor/records/" + id);
  const rep = r.clinical_report;

  R(`
  <div class="card mt">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <h2>Token ${r.token_no} \u2014 ${esc(r.patient || "Anonymous")}</h2>
        <p class="subtitle">ABHA: ${esc(r.abha || "\u2014")} \u00B7 ABDM: ${esc(r.abdm_ref)}</p>
      </div>
      <span class="chip ${CHIP[r.priority]}">${ICON[r.priority]} ${PL[r.priority]}</span>
    </div>
    <p class="caption mt-sm">Record status: ${esc(r.status)}. The summary below is a draft; the physician remains responsible for the final history.</p>
  </div>

  ${rep ? renderClinicalReport(rep, { mode: "clinician", sections: r.sections }) : legacyReportHtml(r)}

  <div class="card mt">
    <h3>Document evidence &amp; review</h3>
    ${(r.documents || []).length ? (r.documents || []).map(d => {
      const e = d.entities || {}, flags = e.review_flags || [];
      const facts = (e.facts || []).slice(0, 12);
      return `<div class="mt-sm"><b>${esc(d.filename || "Document")}</b>
        <span class="caption mut"> ${esc(d.date || "undated")} · ${esc(d.engine || "unknown engine")}</span>
        ${flags.length ? `<div class="caption" style="color:var(--warning)">Review: ${esc(flags.join(", "))}</div>` : ""}
        ${facts.length ? `<ul class="caption">${facts.map(f => `<li>${esc(f.field)}: ${esc(typeof f.value === "string" ? f.value : JSON.stringify(f.value))} · ${esc(f.status)} · ${Math.round((f.confidence || 0) * 100)}%${f.source?.page ? ` · page ${f.source.page}` : ""}</li>`).join("")}</ul>` : `<p class="caption mut">No structured facts extracted; review original document.</p>`}
      </div>`;
    }).join("") : `<p class="caption mut">No uploaded documents.</p>`}
  </div>

  <div class="row mt"><button class="btn btn-outline" id="bk">Queue</button></div>
  <pre id="fx" hidden>${esc(JSON.stringify(r.fhir, null, 2))}</pre>
  `);

  // No unvalidated disease classifier is displayed as a clinical prediction.

  const save = async st => {
    const sec = r.sections.map((s, i) => ({ title: s.title, text: document.querySelector(`[data-i="${i}"]`).value }));
    const finding_reviews = {};
    document.querySelectorAll('#red-flag-suggestions input[type=radio]:checked').forEach(x => { finding_reviews[x.name.replace("fr-", "")] = x.value; });
    await api("/doctor/records/" + id, { method: "PUT", json: { sections: sec, status: st, finding_reviews }});
    queue();
  };
  document.getElementById("bk").onclick = queue;
  const on = (i, f) => { const el = document.getElementById(i); if (el) el.onclick = f; };
  on("cf", () => save("confirmed")); on("am", () => save("amended")); on("rj", () => save("rejected"));
  on("fhbtn", () => { document.getElementById("fx").hidden = !document.getElementById("fx").hidden; });
}

// ─── EDA / Analytics ─────────────────────────────────────────────────────
async function edaPage() {
  R(`<div class="mt"><h2>Analytics &amp; EDA</h2><p class="subtitle">De-identified aggregate statistics</p></div><div class="spinner"></div>`);
  let summary = {}, labs = {}, quality = {};
  try { summary = await api("/eda/summary"); } catch(e) {}
  try { labs = await api("/eda/labs"); } catch(e) {}
  try { quality = await api("/eda/data-quality"); } catch(e) {}

  const ccDist = summary.chief_complaint_dist || {};
  const ccKeys = Object.keys(ccDist);
  const ccMax = Math.max(...Object.values(ccDist), 1);

  R(`
  <div class="mt">
    <h2>Analytics &amp; EDA</h2>
    <p class="subtitle">De-identified · ${summary.total_records || 0} records · Research audit trail</p>
  </div>

  <!-- KPI row -->
  <div class="eda-kpi">
    <div class="kpi-box"><div class="val">${summary.total_records || 0}</div><div class="lbl">Records</div></div>
    <div class="kpi-box teal"><div class="val">${summary.avg_completeness_pct || 0}%</div><div class="lbl">Complete</div></div>
    <div class="kpi-box warn"><div class="val">${summary.ayush_mode_pct || 0}%</div><div class="lbl">AYUSH</div></div>
    <div class="kpi-box"><div class="val">${quality.avg_text_quality_score || 0}</div><div class="lbl">OCR score</div></div>
  </div>

  <!-- Chief complaint distribution -->
  <div class="card">
    <h3>Chief complaint distribution</h3>
    <div class="bar-chart">
      ${ccKeys.slice(0, 8).map(k => {
        const pct = Math.round((ccDist[k] / ccMax) * 100);
        return `<div class="bar-col">
          <div class="bar-fill" style="height:${pct}%;background:var(--primary)"></div>
          <div class="bar-lbl">${esc(k)}<br><b>${ccDist[k]}</b></div>
        </div>`;
      }).join("") || "<p class='mut'>No data</p>"}
    </div>
  </div>

  <!-- Priority distribution -->
  <div class="card">
    <h3>Priority mix</h3>
    <div class="eda-kpi">
      ${Object.entries(summary.priority_dist || {}).map(([p, n]) => `
        <div class="kpi-box ${["","danger","warn","teal"][+p] || ""}">
          <div class="val">${n}</div>
          <div class="lbl">${["","Emergency","Urgent","Routine"][+p] || "P"+p}</div>
        </div>`).join("")}
    </div>
  </div>

  <!-- Red flags -->
  ${Object.keys(summary.flag_code_dist || {}).length ? `
  <div class="card">
    <h3>Red-flag codes</h3>
    <table class="mt-sm">
      <thead><tr><th>Code</th><th>Count</th></tr></thead>
      <tbody>${Object.entries(summary.flag_code_dist).map(([c, n]) => `<tr><td>${esc(c)}</td><td><b>${n}</b></td></tr>`).join("")}</tbody>
    </table>
  </div>` : ""}

  <!-- Lab stats -->
  ${Object.keys(labs.lab_stats || {}).length ? `
  <div class="card">
    <h3>Lab value EDA (${labs.total_docs_analysed || 0} docs)</h3>
    <table class="mt-sm">
      <thead><tr><th>Test</th><th>n</th><th>Mean</th><th>Min</th><th>Max</th><th>Abnormal%</th></tr></thead>
      <tbody>${Object.entries(labs.lab_stats).map(([test, s]) => `
        <tr>
          <td>${esc(test)}</td>
          <td>${s.n}</td>
          <td>${s.mean}</td>
          <td>${s.min}</td>
          <td>${s.max}</td>
          <td><span class="chip ${s.abnormal_pct > 30 ? "chip-emergency" : "chip-routine"}">${s.abnormal_pct}%</span></td>
        </tr>`).join("")}</tbody>
    </table>
  </div>` : ""}

  <!-- Data quality -->
  <div class="card">
    <h3>Data cleaning pipeline</h3>
    <ol style="padding-left:20px;font-size:.88rem;line-height:1.9;margin-top:8px">
      ${(quality.cleaning_pipeline || []).map(s => `<li>${esc(s)}</li>`).join("")}
    </ol>
    ${quality.entity_extraction_coverage_pct ? `
    <div class="eda-kpi mt">
      ${Object.entries(quality.entity_extraction_coverage_pct).map(([k, v]) => `
        <div class="kpi-box teal"><div class="val">${v}%</div><div class="lbl">${esc(k)} coverage</div></div>`).join("")}
    </div>` : ""}
    ${quality.ocr_engine_dist ? `
    <table class="mt">
      <thead><tr><th>OCR Engine</th><th>Documents</th></tr></thead>
      <tbody>${Object.entries(quality.ocr_engine_dist).map(([e, n]) => `<tr><td>${esc(e)}</td><td>${n}</td></tr>`).join("")}</tbody>
    </table>` : ""}
  </div>

  <p class="mut caption center mt" style="padding-bottom:8px">Reference: MIMIC-III benchmarks · Rajkomar et al. 2019 audit trail guidelines</p>
  `);
}

// ─── Help page ────────────────────────────────────────────────────────────
function helpPage() {
  R(`
  <div class="mt">
    <h2>Physician Guide</h2>
    <p class="subtitle">How to use the MediKiosk console</p>
  </div>
  <div class="card">
    <h3>Workflow</h3>
    <div class="timeline mt-sm">
      <div class="timeline-item"><div class="timeline-dot"></div>
        <div class="timeline-title">Patient completes intake kiosk</div>
        <div class="timeline-body">Voice/touch interview → document upload → consent → summary generated</div>
      </div>
      <div class="timeline-item"><div class="timeline-dot teal"></div>
        <div class="timeline-title">Record appears in your queue</div>
        <div class="timeline-body">Emergency → Urgent → Routine ordering. Queue auto-refreshes every 15s.</div>
      </div>
      <div class="timeline-item"><div class="timeline-dot warn"></div>
        <div class="timeline-title">Review and edit the draft</div>
        <div class="timeline-body">All sections are editable. Red-flag rules and evidence are provisional and require clinical review.</div>
      </div>
      <div class="timeline-item"><div class="timeline-dot"></div>
        <div class="timeline-title">Confirm, Amend or Reject</div>
        <div class="timeline-body">Saved status + FHIR R4 bundle generated for ABDM.</div>
      </div>
    </div>
  </div>
  <div class="card">
    <h3>Red-flag codes</h3>
    <table class="mt-sm">
      <thead><tr><th>Code</th><th>Meaning</th><th>Level</th></tr></thead>
      <tbody>
        <tr><td>ACS</td><td>Possible acute coronary syndrome</td><td><span class="chip chip-emergency">Emergency</span></td></tr>
        <tr><td>STROKE</td><td>Focal weakness — possible stroke</td><td><span class="chip chip-emergency">Emergency</span></td></tr>
        <tr><td>RESP</td><td>Severe breathlessness</td><td><span class="chip chip-emergency">Emergency</span></td></tr>
        <tr><td>SAH_MENING</td><td>Thunderclap headache / meningism</td><td><span class="chip chip-emergency">Emergency</span></td></tr>
        <tr><td>GIB</td><td>Possible GI bleed</td><td><span class="chip chip-urgent">Urgent</span></td></tr>
        <tr><td>TB_HAEMOPTYSIS</td><td>Haemoptysis / TB pattern</td><td><span class="chip chip-urgent">Urgent</span></td></tr>
        <tr><td>SYNCOPE</td><td>Severe symptoms with syncope</td><td><span class="chip chip-urgent">Urgent</span></td></tr>
        <tr><td>KEYWORD</td><td>Emergency keyword in patient text</td><td><span class="chip chip-emergency">Emergency</span></td></tr>
      </tbody>
    </table>
  </div>
  <div class="card">
    <h3>Model and evidence status</h3>
    <p style="font-size:.88rem;line-height:1.7;margin-top:6px">
      No trained clinical risk classifier or disease-prediction checkpoint is included in this project. The patient summary is an extraction-first draft, and red-flag suggestions are generated by provisional deterministic rules. Do not interpret them as a diagnosis or as a validated probability.
    </p>
    <p class="mut caption mt-sm">Relevant research candidates: <a href="https://aclanthology.org/2024.emnlp-main.936/" target="_blank" rel="noopener">MediTOD (2024)</a> for history-taking dialogue and <a href="https://aclanthology.org/2025.nlpai4health-main.10/" target="_blank" rel="noopener">NLP4Health (2025)</a> for multilingual summarization/QA.</p>
  </div>
  <p class="mut caption center mt">MediKiosk v1.0 · SIH PS-4 · Ministry of Ayush / AIIA<br>Not clinically validated. Physician remains responsible.</p>
  `);
}

// ─── Bootstrap ────────────────────────────────────────────────────────────
TOKEN ? queue() : login();
</script>
</body></html>
