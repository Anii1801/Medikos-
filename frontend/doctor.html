<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MediKiosk – Clinical workspace</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body class="doctor-app">
<a class="skip-link" href="#app">Skip to content</a>

<aside class="doctor-sidebar" aria-label="Clinical navigation">
  <div class="doctor-sidebar-brand">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" focusable="false">
        <rect width="32" height="32" rx="7" fill="currentColor"/>
        <path d="M5 17h5.2l2.3-6.2 3.4 12.4L18.6 17H27" fill="none" stroke="#F4F7F5" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </span>
    <span>MediKiosk</span>
  </div>
  <button class="sidebar-link active" data-tab="overview" type="button">Overview</button>
  <button class="sidebar-link" data-tab="q" type="button">Review Queue <span class="sidebar-badge">Live</span></button>
  <button class="sidebar-link" data-tab="patients" type="button">Patients</button>
  <button class="sidebar-link" data-tab="encounters" type="button">Encounters</button>
  <button class="sidebar-link" data-tab="documents" type="button">Medical Documents</button>
  <button class="sidebar-link" data-tab="summaries" type="button">Clinical Summaries</button>
  <button class="sidebar-link" data-tab="eda" type="button">Audit</button>
  <button class="sidebar-link" data-tab="settings" type="button">Settings</button>
  <button class="sidebar-link" data-tab="help" type="button">Guide</button>
</aside>

<header class="appbar">
  <div class="appbar-brand">
    <span class="appbar-logo">Clinical workspace</span>
  </div>
  <div class="appbar-actions">
    <button class="icon-btn" id="big" type="button" title="Larger text" aria-label="Larger text">A+</button>
    <button class="icon-btn" id="hc" type="button" title="High contrast" aria-label="High contrast">◐</button>
    <a class="btn btn-outline btn-sm" href="index.html">Patient portal</a>
  </div>
</header>

<nav class="bottom-nav" aria-label="Clinical sections">
  <button class="nav-item active" id="bn-overview" type="button">Overview</button>
  <button class="nav-item" id="bn-q" type="button">Queue</button>
  <button class="nav-item" id="bn-eda" type="button">Audit</button>
  <button class="nav-item" id="bn-help" type="button">Guide</button>
</nav>

<main class="page" id="app"></main>

<script src="common.js"></script>
<script>
a11y();
const R = h => document.getElementById("app").innerHTML = h;
const PL = ["", "Emergency", "Urgent", "Routine"];
const CHIP = ["", "chip-emergency", "chip-urgent", "chip-routine"];
const ICON = ["", "Emergency", "Urgent", "Routine"];
const QCLS = ["", "em", "ur", "ro"];
let timer, currentTab = "overview", lastRecords = [];

function setNav(tab) {
  currentTab = tab;
  document.querySelectorAll(".sidebar-link").forEach(el => el.classList.toggle("active", el.dataset.tab === tab));
  ["overview","q","eda","help"].forEach(t => {
    const el = document.getElementById("bn-" + t);
    if (el) el.classList.toggle("active", t === tab || (tab !== "overview" && tab !== "q" && tab !== "eda" && tab !== "help" && t === "q" && ["patients","encounters","documents","summaries"].includes(tab)));
  });
}

function switchTab(tab) {
  setNav(tab);
  if (tab === "help") return helpPage();
  if (!TOKEN) return login();
  if (tab === "overview") return overview();
  if (tab === "q") return queue();
  if (tab === "patients") return patientsPage();
  if (tab === "encounters") return encountersPage();
  if (tab === "documents") return documentsHub();
  if (tab === "summaries") return summariesPage();
  if (tab === "eda") return edaPage();
  if (tab === "settings") return settingsPage();
}

document.querySelectorAll(".sidebar-link").forEach(btn => btn.onclick = () => switchTab(btn.dataset.tab));
document.getElementById("bn-overview").onclick = () => switchTab("overview");
document.getElementById("bn-q").onclick = () => switchTab("q");
document.getElementById("bn-eda").onclick = () => switchTab("eda");
document.getElementById("bn-help").onclick = () => switchTab("help");

function login(msg = "") {
  clearInterval(timer);
  R(`
  <div class="card mt" style="max-width:400px;margin:40px auto">
    <div class="center mb">
      <span class="brand-mark" style="margin:0 auto;color:var(--primary)">${mkLogo({ compact: true })}</span>
      <h1 style="margin-top:12px;font-size:1.4rem">Clinician sign in</h1>
      <p class="subtitle">Secure access to the review queue</p>
    </div>
    <label class="input-label" for="u">Username</label>
    <input type="text" id="u" autocomplete="username">
    <label class="input-label" for="p">Password</label>
    <input type="password" id="p" autocomplete="current-password">
    <button class="btn btn-lg btn-block mt" id="go">Log in</button>
    ${msg ? `<p class="field-error">${esc(msg)}</p>` : ""}
    <p class="mut caption mt center">Use the credentials configured by your system administrator.</p>
  </div>`);
  document.getElementById("p").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("go").click(); });
  document.getElementById("go").onclick = async () => {
    const btn = document.getElementById("go");
    btn.disabled = true;
    try {
      const r = await api("/auth/login", { json: { username: document.getElementById("u").value, password: document.getElementById("p").value }});
      if (r.role !== "doctor") { login("Not a doctor account"); return; }
      setToken(r.token); overview();
    } catch (e) { login(e.message); }
  };
}

async function loadRecords() {
  lastRecords = await api("/doctor/records");
  return lastRecords;
}

function awaiting(rs) {
  return rs.filter(r => r.status === "submitted" || r.status === "amended");
}

async function overview() {
  clearInterval(timer);
  setNav("overview");
  let rs;
  try { rs = await loadRecords(); }
  catch (e) { login(); return; }
  const wait = awaiting(rs);
  const em = rs.filter(r => r.priority === 1);
  const recent = [...rs].sort((a, b) => b.created - a.created).slice(0, 5);
  R(`
  <div class="mt">
    <p class="eyebrow">Overview</p>
    <h1>Clinical operations</h1>
    <p class="subtitle">Counts below come from the live encounter queue. Empty values mean no matching records.</p>
  </div>
  <div class="eda-kpi">
    <div class="kpi-box"><div class="val">${wait.length}</div><div class="lbl">Awaiting review</div></div>
    <div class="kpi-box warn"><div class="val">${rs.filter(r => r.status === "submitted").length}</div><div class="lbl">Draft summaries</div></div>
    <div class="kpi-box danger"><div class="val">${em.length}</div><div class="lbl">Emergency priority</div></div>
    <div class="kpi-box teal"><div class="val">${rs.length}</div><div class="lbl">Encounters loaded</div></div>
  </div>
  <div class="card">
    <h2>Recently updated encounters</h2>
    ${recent.length ? recent.map(qCard).join("") : `<p class="empty-state mt">No encounters yet.</p>`}
  </div>
  <p class="mut caption">Document processing status is shown inside each encounter. There is no separate document job queue in the API.</p>
  `);
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openRecord(b.dataset.id));
}

async function queue() {
  clearInterval(timer);
  setNav("q");
  let rs;
  try { rs = await loadRecords(); }
  catch (e) { login(); return; }
  const em = rs.filter(r => r.priority === 1);
  const ur = rs.filter(r => r.priority === 2);
  const ro = rs.filter(r => r.priority === 3);

  R(`
  <div class="mt">
    <div class="row" style="justify-content:space-between;align-items:flex-start">
      <div>
        <p class="eyebrow">Review</p>
        <h1>Review queue</h1>
        <p class="subtitle">Emergency first · refreshes every 15 seconds while this list is open</p>
      </div>
      <button class="btn btn-outline btn-sm" id="lo" type="button">Log out</button>
    </div>
  </div>
  <div class="eda-kpi">
    <div class="kpi-box danger"><div class="val">${em.length}</div><div class="lbl">Emergency</div></div>
    <div class="kpi-box warn"><div class="val">${ur.length}</div><div class="lbl">Urgent</div></div>
    <div class="kpi-box teal"><div class="val">${ro.length}</div><div class="lbl">Routine</div></div>
  </div>
  <div class="card queue-tools">
    <label style="flex:1;min-width:210px;display:block"><span class="input-label">Search patient or token</span>
      <input id="queue-search" type="search" placeholder="Name or token number" autocomplete="off"></label>
    <label style="min-width:150px;display:block"><span class="input-label">Priority</span>
      <select id="queue-priority"><option value="all">All priorities</option><option value="1">Emergency</option><option value="2">Urgent</option><option value="3">Routine</option></select></label>
  </div>
  <div id="queue-list"></div>
  `);

  document.getElementById("lo").onclick = () => { setToken(""); login(); };
  const list = document.getElementById("queue-list");
  const renderQueue = () => {
    const query = document.getElementById("queue-search").value.trim().toLowerCase();
    const priority = document.getElementById("queue-priority").value;
    const filtered = rs.filter(r => {
      const matchesPriority = priority === "all" || String(r.priority) === priority;
      const haystack = `${r.patient || ""} ${r.token_no || ""}`.toLowerCase();
      return matchesPriority && (!query || haystack.includes(query));
    });
    list.innerHTML = filtered.length
      ? filtered.map(qCard).join("")
      : `<div class="empty-state"><p class="subtitle">${rs.length ? "No matching patients" : "No patients yet"}</p><p class="mut">${rs.length ? "Try a different search or priority." : "Queue updates automatically."}</p></div>`;
    list.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openRecord(b.dataset.id));
  };
  document.getElementById("queue-search").oninput = renderQueue;
  document.getElementById("queue-priority").onchange = renderQueue;
  renderQueue();
  timer = setInterval(() => { if (!document.querySelector(".sec-edit") && !document.getElementById("ai-summary")) queue(); }, 15000);
}

function qCard(r) {
  const initials = (r.patient || "?").split(" ").map(w => w[0]).join("").toUpperCase().slice(0,2) || "?";
  const when = r.created ? new Date(r.created * 1000).toLocaleString("en-IN", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }) : "—";
  return `<div class="queue-card ${QCLS[r.priority]}" data-id="${r.id}">
    <div class="patient-initials">${initials}</div>
    <div>
      <div style="font-weight:650">${esc(r.patient || "Anonymous")}</div>
      <div class="mut">Token #${r.token_no} · ${esc(r.status)}</div>
      ${r.flags?.length ? `<div style="font-size:.82rem;color:var(--danger);margin-top:3px">${r.flags.map(f => esc(f.code)).join(" · ")}</div>` : ""}
    </div>
    <div class="queue-meta mut">${when}</div>
    <span class="chip ${CHIP[r.priority]}">${ICON[r.priority]} ${PL[r.priority]}</span>
    <span class="mut">Open</span>
    <span aria-hidden="true">›</span>
  </div>`;
}

async function patientsPage() {
  setNav("patients");
  let rs;
  try { rs = await loadRecords(); } catch (e) { login(); return; }
  const map = new Map();
  rs.forEach(r => {
    const key = (r.patient || "Anonymous") + "|" + (r.abdm_ref || "");
    if (!map.has(key)) map.set(key, { name: r.patient || "Anonymous", count: 0, latest: r });
    const row = map.get(key); row.count += 1; if (r.created > row.latest.created) row.latest = r;
  });
  const people = [...map.values()];
  R(`
  <div class="mt"><p class="eyebrow">Directory</p><h1>Patients</h1>
    <p class="subtitle">Derived from submitted encounters. This is not a separate patient master list.</p></div>
  ${people.length ? `<div class="card"><table class="stack-table">
    <thead><tr><th>Patient</th><th>Encounters</th><th>Latest token</th><th></th></tr></thead>
    <tbody>${people.map(p => `<tr>
      <td data-label="Patient">${esc(p.name)}</td>
      <td data-label="Encounters">${p.count}</td>
      <td data-label="Latest">#${p.latest.token_no}</td>
      <td data-label="Action"><button class="btn btn-sm" data-id="${p.latest.id}">Open latest</button></td>
    </tr>`).join("")}</tbody></table></div>` : `<p class="empty-state">No patient encounters available.</p>`}
  `);
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openRecord(b.dataset.id));
}

async function encountersPage() {
  setNav("encounters");
  let rs;
  try { rs = await loadRecords(); } catch (e) { login(); return; }
  R(`
  <div class="mt"><p class="eyebrow">Workspace</p><h1>Encounters</h1>
    <p class="subtitle">All encounters returned by the clinical queue API.</p></div>
  ${rs.length ? `<div class="card"><table class="stack-table">
    <thead><tr><th>Token</th><th>Patient</th><th>Date</th><th>Priority</th><th>Status</th><th></th></tr></thead>
    <tbody>${rs.map(r => `<tr>
      <td data-label="Token">#${r.token_no}</td>
      <td data-label="Patient">${esc(r.patient || "Anonymous")}</td>
      <td data-label="Date">${new Date(r.created * 1000).toLocaleDateString("en-IN")}</td>
      <td data-label="Priority"><span class="chip ${CHIP[r.priority]}">${PL[r.priority]}</span></td>
      <td data-label="Status">${esc(r.status)}</td>
      <td data-label="Action"><button class="btn btn-sm" data-id="${r.id}">Review</button></td>
    </tr>`).join("")}</tbody></table></div>` : `<p class="empty-state">No encounters yet.</p>`}
  `);
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openRecord(b.dataset.id));
}

function documentsHub() {
  setNav("documents");
  R(`
  <div class="mt"><p class="eyebrow">Documents</p><h1>Medical documents</h1>
    <p class="subtitle">The API attaches documents to a patient encounter. Open a record to review extracted findings.</p></div>
  <p class="empty-state">There is no standalone document inbox. Use Review Queue or Encounters, then open a record.</p>
  <button class="btn mt" id="goq">Open review queue</button>`);
  document.getElementById("goq").onclick = () => switchTab("q");
}

async function summariesPage() {
  setNav("summaries");
  let rs;
  try { rs = await loadRecords(); } catch (e) { login(); return; }
  const drafts = rs.filter(r => r.status === "submitted" || r.status === "amended");
  R(`
  <div class="mt"><p class="eyebrow">Summaries</p><h1>Clinical summaries</h1>
    <p class="subtitle">Encounters still marked submitted or amended.</p></div>
  ${drafts.length ? drafts.map(qCard).join("") : `<p class="empty-state">No draft summaries awaiting approval.</p>`}
  `);
  document.querySelectorAll("[data-id]").forEach(b => b.onclick = () => openRecord(b.dataset.id));
}

function settingsPage() {
  setNav("settings");
  R(`
  <div class="mt"><p class="eyebrow">Settings</p><h1>Workspace settings</h1></div>
  <div class="card">
    <p>Text size and contrast controls are in the header. They apply immediately to this session.</p>
    <div class="row mt">
      <button class="btn btn-outline" id="lo">Log out</button>
      <button class="btn btn-outline" id="go-eda">Open audit analytics</button>
    </div>
  </div>`);
  document.getElementById("lo").onclick = () => { setToken(""); login(); };
  document.getElementById("go-eda").onclick = () => switchTab("eda");
}

function legacyReportHtml(r) {
  return `<section class="rep-card" id="clinical-summary" data-block="clinical_summary"><h2>Clinical Summary</h2>
    <p class="caption">Legacy record without a stored report; draft sections below.</p>
    ${r.sections.map((s, i) => `<div class="sum-sec"><h3>${esc(s.title)}</h3><textarea data-i="${i}">${esc(s.text)}</textarea></div>`).join("")}</section>
  <section class="rep-card rf-section" id="red-flag-suggestions" data-block="red_flag_suggestions"><h2>${RF_LABEL}</h2>
    <p class="rf-notice"><b>${RF_NOTICE}</b></p>
    <div class="rf-state rf-unavailable" role="alert"><div><b>Screening unavailable or incomplete</b><br>${RF_UNAVAILABLE}</div></div></section>
  <section class="rep-card" id="clinician-review"><div class="row" style="flex-wrap:wrap">
    <button class="btn btn-teal" id="cf">Approve summary</button><button class="btn btn-outline" id="rj">Reject</button></div></section>`;
}

async function openRecord(id) {
  clearInterval(timer);
  const r = await api("/doctor/records/" + id);
  const rep = r.clinical_report;
  const when = r.created ? new Date(r.created * 1000).toLocaleString("en-IN") : "—";
  const docs = r.documents || [];

  R(`
  <div class="encounter-shell">
    <div>
      <div class="card mt">
        <div class="row" style="justify-content:space-between;align-items:flex-start">
          <div>
            <p class="eyebrow">Encounter</p>
            <h1>Token ${r.token_no} — ${esc(r.patient || "Anonymous")}</h1>
            <p class="subtitle">ABHA: ${esc(r.abha || "—")} · ABDM: ${esc(r.abdm_ref)} · ${when}</p>
          </div>
          <span class="chip ${CHIP[r.priority]}">${ICON[r.priority]} ${PL[r.priority]}</span>
        </div>
        <p class="caption mt-sm">Record status: ${esc(r.status)}. The summary below is a draft; the physician remains responsible for the final history.</p>
      </div>
      ${rep ? renderClinicalReport(rep, { mode: "clinician", sections: r.sections }) : legacyReportHtml(r)}
      <div class="card mt">
        <h2>Extracted medical reports and laboratory findings</h2>
        ${docs.length ? docs.map(d => {
          const e = d.entities || {}, flags = e.review_flags || [];
          const facts = (e.facts || []).slice(0, 12);
          const labs = e.labs || [];
          return `<div class="mt-sm" style="overflow-wrap:anywhere"><b>${esc(d.filename || "Document")}</b>
            <span class="caption mut"> ${esc(d.date || "undated")} · ${esc(d.engine || "unknown engine")} · ${esc(String(d.doc_type || "").replace("_"," "))}</span>
            <span class="chip">${esc(d.processing_status || "needs_review")}</span>
            ${d.processing_error ? `<p class="caption" role="status">${esc(d.processing_error)}</p>` : ""}
            ${d.has_original ? `<button class="btn btn-outline btn-sm" type="button" data-record-doc-download="${d.id}" data-filename="${esc(d.filename)}">Download original</button>` : ""}
            ${flags.length ? `<div class="caption" style="color:var(--warning)">Review: ${esc(flags.join(", "))}</div>` : ""}
            ${labs.length ? `<ul class="caption">${labs.map(l => `<li>${esc(l.test)}: ${esc(l.value)} ${esc(l.unit || "")} ${esc(l.flag || "")}${l.ref ? ` · ref ${esc(l.ref)}` : ""}</li>`).join("")}</ul>` : ""}
            ${facts.length ? `<ul class="caption">${facts.map(f => `<li>${esc(f.field)}: ${esc(typeof f.value === "string" ? f.value : JSON.stringify(f.value))} · ${esc(f.status)} · ${Math.round((f.confidence || 0) * 100)}%${f.source?.page ? ` · page ${f.source.page}` : ""}</li>`).join("")}</ul>` : `<p class="caption mut">No structured facts extracted; review original document.</p>`}
          </div>`;
        }).join("") : `<p class="caption mut">No uploaded documents.</p>`}
      </div>
      <div class="row mt"><button class="btn btn-outline" id="bk">Queue</button></div>
      <pre id="fx" hidden>${esc(JSON.stringify(r.fhir, null, 2))}</pre>
    </div>
    <aside class="encounter-aside card">
      <h2>Clinician actions</h2>
      <p class="caption">Approve, amend, or reject after reviewing the draft and red-flag suggestions. Status updates only after the server confirms.</p>
      <p class="mut mt-sm">Use the review controls in the clinical document.</p>
    </aside>
  </div>
  `);

  const save = async st => {
    const sec = r.sections.map((s, i) => ({ title: s.title, text: (document.querySelector(`[data-i="${i}"]`) || { value: s.text }).value }));
    const finding_reviews = {};
    document.querySelectorAll('#red-flag-suggestions input[type=radio]:checked').forEach(x => { finding_reviews[x.name.replace("fr-", "")] = x.value; });
    await api("/doctor/records/" + id, { method: "PUT", json: { sections: sec, status: st, finding_reviews }});
    queue();
  };
  document.getElementById("bk").onclick = queue;
  document.querySelectorAll("[data-record-doc-download]").forEach(button => button.onclick = async () => {
    try {
      await downloadDocument(`/doctor/records/${id}/documents/${button.dataset.recordDocDownload}/file`, button.dataset.filename);
    } catch (e) { alert(e.message); }
  });
  const on = (i, f) => { const el = document.getElementById(i); if (el) el.onclick = async () => { el.disabled = true; try { await f(); } catch (e) { el.disabled = false; alert(e.message); } }; };
  on("cf", () => save("confirmed")); on("am", () => save("amended")); on("rj", () => save("rejected"));
  on("fhbtn", () => { document.getElementById("fx").hidden = !document.getElementById("fx").hidden; });
}

async function edaPage() {
  setNav("eda");
  R(`<div class="mt"><h1>Audit and analytics</h1><p class="subtitle">De-identified aggregate statistics</p></div><div class="spinner"></div>`);
  let summary = {}, labs = {}, quality = {};
  try { summary = await api("/eda/summary"); } catch (e) {}
  try { labs = await api("/eda/labs"); } catch (e) {}
  try { quality = await api("/eda/data-quality"); } catch (e) {}
  const ccDist = summary.chief_complaint_dist || {};
  const ccKeys = Object.keys(ccDist);
  const ccMax = Math.max(...Object.values(ccDist), 1);
  R(`
  <div class="mt">
    <h1>Audit and analytics</h1>
    <p class="subtitle">De-identified · ${summary.total_records || 0} records</p>
  </div>
  <div class="eda-kpi">
    <div class="kpi-box"><div class="val">${summary.total_records || 0}</div><div class="lbl">Records</div></div>
    <div class="kpi-box teal"><div class="val">${summary.avg_completeness_pct || 0}%</div><div class="lbl">Complete</div></div>
    <div class="kpi-box warn"><div class="val">${summary.ayush_mode_pct || 0}%</div><div class="lbl">AYUSH</div></div>
    <div class="kpi-box"><div class="val">${quality.avg_text_quality_score || 0}</div><div class="lbl">OCR score</div></div>
  </div>
  <div class="card">
    <h2>Chief complaint distribution</h2>
    <div class="bar-chart">
      ${ccKeys.slice(0, 8).map(k => {
        const pct = Math.round((ccDist[k] / ccMax) * 100);
        return `<div class="bar-col"><div class="bar-fill" style="height:${pct}%"></div><div class="bar-lbl">${esc(k)}<br><b>${ccDist[k]}</b></div></div>`;
      }).join("") || "<p class='mut'>No data</p>"}
    </div>
  </div>
  <div class="card">
    <h2>Priority mix</h2>
    <div class="eda-kpi">
      ${Object.entries(summary.priority_dist || {}).map(([p, n]) => `
        <div class="kpi-box ${["","danger","warn","teal"][+p] || ""}"><div class="val">${n}</div><div class="lbl">${["","Emergency","Urgent","Routine"][+p] || "P"+p}</div></div>`).join("")}
    </div>
  </div>
  ${Object.keys(summary.flag_code_dist || {}).length ? `
  <div class="card"><h2>Red-flag codes</h2>
    <table class="mt-sm"><thead><tr><th>Code</th><th>Count</th></tr></thead>
      <tbody>${Object.entries(summary.flag_code_dist).map(([c, n]) => `<tr><td>${esc(c)}</td><td><b>${n}</b></td></tr>`).join("")}</tbody></table>
  </div>` : ""}
  ${Object.keys(labs.lab_stats || {}).length ? `
  <div class="card"><h2>Lab value EDA (${labs.total_docs_analysed || 0} docs)</h2>
    <table class="mt-sm stack-table"><thead><tr><th>Test</th><th>n</th><th>Mean</th><th>Min</th><th>Max</th><th>Abnormal%</th></tr></thead>
      <tbody>${Object.entries(labs.lab_stats).map(([test, s]) => `
        <tr><td data-label="Test">${esc(test)}</td><td data-label="n">${s.n}</td><td data-label="Mean">${s.mean}</td><td data-label="Min">${s.min}</td><td data-label="Max">${s.max}</td>
        <td data-label="Abnormal%"><span class="chip ${s.abnormal_pct > 30 ? "chip-emergency" : "chip-routine"}">${s.abnormal_pct}%</span></td></tr>`).join("")}</tbody></table>
  </div>` : ""}
  <div class="card">
    <h2>Data cleaning pipeline</h2>
    <ol style="padding-left:20px;font-size:.88rem;line-height:1.9;margin-top:8px">
      ${(quality.cleaning_pipeline || []).map(s => `<li>${esc(s)}</li>`).join("")}
    </ol>
  </div>
  `);
}

      <div class="timeline-item"><div class="timeline-dot"></div>
        <div class="timeline-title">Approve, amend, or reject</div>
        <div class="timeline-body">Saved status and FHIR R4 bundle for ABDM.</div>

  </div>
  <div class="card">

    <table class="mt-sm stack-table">

        <tr><td data-label="Code">RESP</td><td data-label="Meaning">Severe breathlessness</td><td data-label="Level"><span class="chip chip-emergency">Emergency</span></td></tr>
        <tr><td data-label="Code">SAH_MENING</td><td data-label="Meaning">Thunderclap headache / meningism</td><td data-label="Level"><span class="chip chip-emergency">Emergency</span></td></tr>
        <tr><td data-label="Code">GIB</td><td data-label="Meaning">Possible GI bleed</td><td data-label="Level"><span class="chip chip-urgent">Urgent</span></td></tr>
        <tr><td data-label="Code">TB_HAEMOPTYSIS</td><td data-label="Meaning">Haemoptysis / TB pattern</td><td data-label="Level"><span class="chip chip-urgent">Urgent</span></td></tr>
        <tr><td data-label="Code">SYNCOPE</td><td data-label="Meaning">Severe symptoms with syncope</td><td data-label="Level"><span class="chip chip-urgent">Urgent</span></td></tr>

      </tbody>
    </table>
  </div>
  <div class="card">
